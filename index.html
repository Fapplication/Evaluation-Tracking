<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Evaluation Portal - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --primary: #1a73e8;
      --primary-dark: #0d47a1;
      --error: #ea4335;
      --gray-200: #eeeeee;
      --gray-700: #616161;
      --gray-900: #212121;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      padding: 32px 24px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-header .logo-icon {
      background: var(--primary);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .login-header h2 {
      font-size: 22px;
      color: var(--gray-900);
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .material-icons {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9e9e9e;
      font-size: 20px;
    }
    .input-wrapper input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { background: var(--primary-dark); }
    .error-message {
      background: #fce8e6;
      color: var(--error);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo-icon"><span class="material-icons">gavel</span></div>
      <h2>Bid Evaluation Portal</h2>
    </div>
    <div id="errorMessage" class="error-message">
      <span class="material-icons">error</span>
      <span id="errorText"></span>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <span class="material-icons">person</span>
          <input type="text" id="username" required placeholder="Enter username">
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="material-icons">lock</span>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <span>Sign In</span>
        <span class="material-icons">arrow_forward</span>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      const errBox = document.getElementById('errorMessage');
      
      loginBtn.disabled = true;
      errBox.style.display = 'none';
      
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            sessionStorage.setItem('bidPortalUser', JSON.stringify(result.user));
            google.script.run.withSuccessHandler(function(html) {
              document.open(); document.write(html); document.close();
            }).getDashboardPage();
          } else {
            document.getElementById('errorText').textContent = result.message;
            errBox.style.display = 'flex';
            loginBtn.disabled = false;
          }
        })
        .withFailureHandler(function() {
          document.getElementById('errorText').textContent = 'Connection error. Please try again.';
          errBox.style.display = 'flex';
          loginBtn.disabled = false;
        })
        .login(document.getElementById('username').value, document.getElementById('password').value);
    });
  </script>
</body>
</html>
