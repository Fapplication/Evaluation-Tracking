<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bid Evaluation Portal — Bid Detail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0D1B2A;
    --navy-mid:    #1A2E45;
    --navy-light:  #243B55;
    --navy-card:   #162436;
    --accent:      #2196F3;
    --accent-dim:  rgba(33,150,243,0.12);
    --gold:        #FFC107;
    --white:       #FFFFFF;
    --grey-300:    #CBD5E1;
    --grey-500:    #64748B;
    --grey-600:    #475569;
    --danger:      #EF4444;
    --danger-dim:  rgba(239,68,68,0.12);
    --success:     #22C55E;
    --success-dim: rgba(34,197,94,0.12);
    --warning:     #F59E0B;
    --warning-dim: rgba(245,158,11,0.12);
    --purple:      #8B5CF6;
    --purple-dim:  rgba(139,92,246,0.12);
    --radius:      10px;
    --radius-lg:   14px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--white);
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

  /* ── Top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--navy-mid);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    height: 60px;
    backdrop-filter: blur(12px);
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--grey-300);
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .back-btn:hover { background: rgba(255,255,255,0.09); color: var(--white); }

  .topbar-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--grey-500);
    flex: 1;
  }
  .topbar-breadcrumb .sep { opacity: 0.4; }
  .topbar-breadcrumb .current { color: var(--white); font-weight: 600; }

  .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* ── Page layout ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; display: flex; flex-direction: column; gap: 20px; }

  /* ── Hero header ── */
  .bid-hero {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-lg);
    padding: 28px 28px 24px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
  }
  .bid-hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2196F3, #8B5CF6);
  }
  .hero-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--accent-dim);
    border: 1px solid rgba(33,150,243,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .hero-body { flex: 1; min-width: 0; }
  .hero-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .hero-name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--grey-300);
  }
  .meta-pill.accent { background: var(--accent-dim); border-color: rgba(33,150,243,0.25); color: #90CAF9; }

  .hero-stats {
    display: flex;
    gap: 0;
    margin-left: auto;
    flex-shrink: 0;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .hstat {
    padding: 14px 20px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .hstat:last-child { border-right: none; }
  .hstat-val { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hstat-lbl { font-size: 10px; color: var(--grey-500); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }

  /* ── Progress timeline ── */
  .timeline-panel {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-lg);
    padding: 24px;
  }
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .timeline-title {
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .overall-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .obar-track {
    width: 160px;
    height: 7px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: hidden;
  }
  .obar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }

  /* Phase rows */
  .phases { display: flex; flex-direction: column; gap: 20px; }
  .phase-block {
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .phase-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.025);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .phase-head-icon { font-size: 16px; }
  .phase-head-title { font-size: 13px; font-weight: 700; flex: 1; }
  .phase-progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--grey-500);
  }
  .phase-progress-bar { width: 80px; height: 4px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
  .phase-progress-fill { height: 100%; border-radius: 99px; }

  .activities-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .activity-cell {
    padding: 14px 16px;
    border-right: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }
  .activity-cell:last-child { border-right: none; }
  .activity-cell.done   { background: rgba(34,197,94,0.04); }
  .activity-cell.active { background: rgba(33,150,243,0.05); }
  .activity-cell.delayed { background: rgba(239,68,68,0.05); }

  .act-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--grey-600);
    margin-bottom: 6px;
  }
  .act-status-icon { font-size: 18px; margin-bottom: 4px; }
  .act-status-text {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .act-dates { display: flex; flex-direction: column; gap: 2px; }
  .act-date-row { display: flex; gap: 4px; font-size: 10px; }
  .act-date-key { color: var(--grey-600); width: 26px; flex-shrink: 0; }
  .act-date-val { color: var(--grey-300); font-family: 'JetBrains Mono', monospace; }
  .act-sla-badge {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
  }
  .act-sla-badge.ok      { background: var(--success-dim); color: var(--success); }
  .act-sla-badge.delayed { background: var(--danger-dim);  color: #FCA5A5; }
  .act-sla-badge.late    { background: var(--warning-dim); color: var(--warning); }

  /* connector line between activities */
  .connector {
    position: absolute;
    right: -1px; top: 50%;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid rgba(255,255,255,0.12);
    z-index: 1;
  }
  .activity-cell:last-child .connector { display: none; }

  /* ── Two-col grid ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  /* ── Panel ── */
  .panel {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .panel-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .panel-body  { padding: 18px; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    padding: 9px 14px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--grey-600);
    background: rgba(255,255,255,0.02);
  }
  tbody tr { border-top: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  tbody td { padding: 11px 14px; vertical-align: middle; }

  /* ── Badges ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .badge-active    { background: var(--success-dim); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
  .badge-active::before { background: var(--success); }
  .badge-completed { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(33,150,243,0.2); }
  .badge-completed::before { background: var(--accent); }
  .badge-delayed   { background: var(--danger-dim);  color: #FCA5A5; border: 1px solid rgba(239,68,68,0.2); }
  .badge-delayed::before { background: var(--danger); animation: blink 1.2s infinite; }
  .badge-pending   { background: rgba(255,255,255,0.05); color: var(--grey-500); border: 1px solid rgba(255,255,255,0.08); }
  .badge-pending::before { background: var(--grey-500); }
  .badge-tech      { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
  .badge-tech::before { background: var(--warning); }
  .badge-fin       { background: var(--purple-dim); color: #C4B5FD; border: 1px solid rgba(139,92,246,0.2); }
  .badge-fin::before { background: var(--purple); }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius); border: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: linear-gradient(135deg,#2196F3,#1565C0); color: var(--white); }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--grey-300); }
  .btn-ghost:hover { background: rgba(255,255,255,0.09); color: var(--white); }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn-danger { background: var(--danger-dim); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }

  /* ── Rank table ── */
  .rank-1 { color: #FFD700; }
  .rank-2 { color: #C0C0C0; }
  .rank-3 { color: #CD7F32; }
  .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .score-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; min-width: 60px; }
  .score-bar-fill { height: 100%; border-radius: 99px; }

  /* ── Info grid ── */
  .info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; }
  .info-cell {
    padding: 14px 18px;
    border-right: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .info-cell:nth-child(3n) { border-right: none; }
  .info-cell:nth-last-child(-n+3) { border-bottom: none; }
  .info-key { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--grey-600); margin-bottom: 4px; }
  .info-val { font-size: 13px; font-weight: 500; color: var(--white); }
  .info-val.mono { font-family: 'JetBrains Mono', monospace; color: var(--accent); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--navy-mid);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-lg);
    width: 560px; max-width: calc(100vw - 40px);
    max-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.2s; overflow: hidden;
  }
  .modal-overlay.open .modal { transform: none; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
  }
  .modal-title { font-size: 15px; font-weight: 700; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 7px;
    background: rgba(255,255,255,0.06); border: none;
    color: var(--grey-500); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: var(--white); }
  .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.07); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

  .form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.tri { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--grey-500); }
  .form-group input, .form-group select, .form-group textarea {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
    border-radius: var(--radius); padding: 9px 11px;
    font-size: 13px; font-family: 'Inter', sans-serif; color: var(--white); outline: none;
    transition: border-color 0.2s, background 0.2s; width: 100%;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent); background: rgba(33,150,243,0.07);
  }
  .form-group input::placeholder, .form-group textarea::placeholder { color: var(--grey-600); }
  .form-group select option { background: #1A2E45; }
  .form-group textarea { resize: vertical; min-height: 64px; }
  .inline-error { font-size: 12px; color: #FCA5A5; padding: 8px 12px; background: var(--danger-dim); border-radius: 8px; border: 1px solid rgba(239,68,68,0.2); }
  .section-divider {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--grey-600); margin: 2px 0;
  }
  .section-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

  /* Act tabs */
  .act-tab-bar { display: flex; gap: 4px; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 4px; border: 1px solid rgba(255,255,255,0.06); }
  .act-tab {
    flex: 1; padding: 8px; border: none; border-radius: 8px;
    background: transparent; color: var(--grey-500);
    font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: all 0.15s;
  }
  .act-tab.active { background: rgba(33,150,243,0.15); color: var(--accent); }
  .act-tab:hover:not(.active) { background: rgba(255,255,255,0.04); color: var(--grey-300); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--navy-light); border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius); padding: 11px 16px;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    transform: translateY(12px); opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 999; max-width: 300px;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: all; }
  .toast.success { border-color: rgba(34,197,94,0.35); }
  .toast.error   { border-color: rgba(239,68,68,0.35); }

  /* Loading */
  .loading-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; gap: 14px;
    color: var(--grey-600); font-size: 14px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(33,150,243,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 28px; color: var(--grey-600); font-size: 13px; text-align: center;
  }
  .empty-state .big { font-size: 26px; }

  /* Responsive */
  @media (max-width: 800px) {
    .activities-grid { grid-template-columns: 1fr 1fr; }
    .two-col, .three-col, .info-grid { grid-template-columns: 1fr; }
    .hero-stats { display: none; }
  }
  @media (max-width: 480px) {
    .activities-grid { grid-template-columns: 1fr; }
    .form-row, .form-row.tri { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"><span id="toastIcon">✅</span><span id="toastMsg"></span></div>

<!-- ═══════════ ACTIVITY MODAL ═══════════ -->
<div class="modal-overlay" id="activityModal">
  <div class="modal" style="width:660px">
    <div class="modal-header">
      <div class="modal-title">⚙️ Update Activities</div>
      <button class="modal-close" onclick="closeModal('activityModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="act-tab-bar">
        <button class="act-tab active" data-tab="tech" onclick="switchActTab('tech')">🔬 Technical</button>
        <button class="act-tab" data-tab="fin" onclick="switchActTab('fin')">💰 Financial</button>
      </div>
      <div id="techPane">
        <div class="section-divider">Doc Collection</div>
        <div class="form-row tri">
          <div class="form-group"><label>Start</label><input id="tDocStart" type="date"/></div>
          <div class="form-group"><label>End</label><input id="tDocEnd" type="date"/></div>
          <div class="form-group"><label>Status</label><select id="tDocStatus"><option value="PENDING">Pending</option><option value="IN_PROGRESS">In Progress</option><option value="COMPLETED">Completed</option></select></div>
        </div>
        <div class="section-divider">Clarification</div>
        <div class="form-row tri">
          <div class="form-group"><label>Start</label><input id="tClarStart" type="date"/></div>
          <div class="form-group"><label>End</label><input id="tClarEnd" type="date"/></div>
          <div class="form-group"><label>Status</label><select id="tClarStatus"><option value="PENDING">Pending</option><option value="N/A">N/A</option><option value="IN_PROGRESS">In Progress</option><option value="COMPLETED">Completed</option></select></div>
        </div>
        <div class="section-divider">Evaluation Progress</div>
        <div class="form-row tri">

<script>
// ═══════════════════════
//  STATE
// ═══════════════════════
let SESSION_ID = null;
let BID_ID     = null;
let BID        = null;

// ═══════════════════════
//  INIT
// ═══════════════════════
window.onload = function () {
  SESSION_ID = sessionStorage.getItem('sessionId');
  if (!SESSION_ID) { window.location.href = '?page=login'; return; }

  const params = new URLSearchParams(window.location.search);
  BID_ID = params.get('bidId');
  if (!BID_ID) { window.location.href = '?page=dashboard'; return; }

  loadBid();
};

function loadBid() {
  document.getElementById('pageContent').innerHTML = `
    <div class="loading-screen"><div class="spinner"></div>Loading bid details…</div>`;
  google.script.run
    .withSuccessHandler(onBidLoaded)
    .withFailureHandler(e => showToast(e.message, 'error'))
    .getBidById(BID_ID, SESSION_ID);
}

function onBidLoaded(res) {
  if (!res.success) {
    showToast(res.message, 'error');
    return;
  }
  BID = res.bid;
  document.getElementById('breadBidNum').textContent = BID.BID_NUMBER;
  renderPage();
}

function goBack() {
  window.location.href = '?page=dashboard';
}

// ═══════════════════════
//  RENDER
// ═══════════════════════
function renderPage() {
  const b  = BID;
  const ta = b.techActivities || {};
  const fa = b.finActivities  || {};
  const delays = b.delays || [];
  const bidders = [...(b.bidders || [])].sort((a, x) => (a.RANK||99)-(x.RANK||99));
  const clarifs = b.clarifications || [];
  const pct = b.overallProgress || 0;

  // SLA map for delay lookup
  const SLA = {
    'TECH_DOC': 5, 'CLARIFICATION': 7, 'EVAL_PROGRESS': 10, 'EVAL_REPORT': 5,
    'FIN_DOC': 5,  'ENG_EST': 7,       'DOC_AUTH': 3,        'FIN_REPORT': 5
  };

  document.getElementById('pageContent').innerHTML = `

    <!-- ── Hero ── -->
    <div class="bid-hero">
      <div class="hero-icon">📋</div>
      <div class="hero-body">
        <div class="hero-number">${esc(b.BID_NUMBER)}</div>
        <div class="hero-name">${esc(b.BID_NAME)}</div>
        <div class="hero-meta">
          ${phaseBadge(b.CURRENT_PHASE)}
          ${statusBadge(b.STATUS, delays.length > 0)}
          <span class="meta-pill">📌 ${esc(b.PAC_LEVEL)}</span>
          <span class="meta-pill accent">🛒 ${esc(b.PURCHASE_METHOD)}</span>
          <span class="meta-pill">📅 Registered ${fmtDate(b.REGISTRATION_DATE)}</span>
          <span class="meta-pill">👤 ${esc(b.REGISTERED_BY)}</span>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hstat">
          <div class="hstat-val" style="color:var(--accent)">${pct}%</div>
          <div class="hstat-lbl">Overall</div>
        </div>
        <div class="hstat">
          <div class="hstat-val" style="color:${delays.length>0?'var(--danger)':'var(--success)'}">${delays.length}</div>
          <div class="hstat-lbl">Delays</div>
        </div>
        <div class="hstat">
          <div class="hstat-val">${bidders.length}</div>
          <div class="hstat-lbl">Bidders</div>
        </div>
        <div class="hstat">
          <div class="hstat-val">${clarifs.length}</div>
          <div class="hstat-lbl">Clarifs</div>
        </div>
      </div>
    </div>

    <!-- ── Bid info ── -->
    <div class="panel">
      <div class="panel-header"><div class="panel-title">ℹ️ Bid Information</div></div>
      <div class="info-grid">
        <div class="info-cell"><div class="info-key">Bid ID</div><div class="info-val mono">${esc(b.BID_ID)}</div></div>
        <div class="info-cell"><div class="info-key">Bid Number</div><div class="info-val mono">${esc(b.BID_NUMBER)}</div></div>
        <div class="info-cell"><div class="info-key">Bid Name</div><div class="info-val">${esc(b.BID_NAME)}</div></div>
        <div class="info-cell"><div class="info-key">PAC Level</div><div class="info-val">${esc(b.PAC_LEVEL)}</div></div>
        <div class="info-cell"><div class="info-key">Purchase Method</div><div class="info-val">${esc(b.PURCHASE_METHOD)}</div></div>
        <div class="info-cell"><div class="info-key">Current Phase</div><div class="info-val">${esc(b.CURRENT_PHASE)}</div></div>
        <div class="info-cell"><div class="info-key">Status</div><div class="info-val">${esc(b.STATUS)}</div></div>
        <div class="info-cell"><div class="info-key">Registration Date</div><div class="info-val">${fmtDate(b.REGISTRATION_DATE)}</div></div>
        <div class="info-cell"><div class="info-key">Registered By</div><div class="info-val">${esc(b.REGISTERED_BY)}</div></div>
        ${b.NOTES ? `<div class="info-cell" style="grid-column:1/-1"><div class="info-key">Notes</div><div class="info-val">${esc(b.NOTES)}</div></div>` : ''}
      </div>
    </div>

    <!-- ── Activity Timeline ── -->
    <div class="timeline-panel">
      <div class="timeline-header">
        <div class="timeline-title">📈 Evaluation Progress Timeline</div>
        <div class="overall-bar">
          <div class="obar-track">
            <div class="obar-fill" style="width:${pct}%;background:${pct===100?'var(--success)':pct>=50?'var(--accent)':'var(--warning)'}"></div>
          </div>
          <span style="color:${pct===100?'var(--success)':pct>=50?'var(--accent)':'var(--warning)'}">${pct}% complete</span>
        </div>
      </div>
      <div class="phases">
        <!-- Technical Phase -->
        ${buildPhaseBlock('🔬', 'Technical Evaluation', [
          buildActCell('Doc Collection',    ta.TECH_DOC_START,      ta.TECH_DOC_END,      ta.TECH_DOC_STATUS,      5,  delays),
          buildActCell('Clarification',     ta.CLARIFICATION_START, ta.CLARIFICATION_END, ta.CLARIFICATION_STATUS, 7,  delays),
          buildActCell('Eval Progress',     ta.EVAL_PROGRESS_START, ta.EVAL_PROGRESS_END, ta.EVAL_PROGRESS_STATUS, 10, delays),
          buildActCell('Eval Report',       ta.EVAL_REPORT_START,   ta.EVAL_REPORT_END,   ta.EVAL_REPORT_STATUS,   5,  delays),
        ], [ta.TECH_DOC_STATUS, ta.CLARIFICATION_STATUS, ta.EVAL_PROGRESS_STATUS, ta.EVAL_REPORT_STATUS])}

        <!-- Financial Phase -->
        ${buildPhaseBlock('💰', 'Financial Evaluation', [
          buildActCell('Fin Doc Collection',  fa.FIN_DOC_START,    fa.FIN_DOC_END,    fa.FIN_DOC_STATUS,    5, delays),
          buildActCell('Eng. Estimation',     fa.ENG_EST_START,    fa.ENG_EST_END,    fa.ENG_EST_STATUS,    7, delays),
          buildActCell('Doc Authentication',  fa.DOC_AUTH_START,   fa.DOC_AUTH_END,   fa.DOC_AUTH_STATUS,   3, delays),
          buildActCell('Fin. Report',         fa.FIN_REPORT_START, fa.FIN_REPORT_END, fa.FIN_REPORT_STATUS, 5, delays),
        ], [fa.FIN_DOC_STATUS, fa.ENG_EST_STATUS, fa.DOC_AUTH_STATUS, fa.FIN_REPORT_STATUS])}
      </div>
    </div>

    <!-- ── Bidders + Clarifications ── -->
    <div class="two-col">

      <!-- Bidders -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🏢 Bidders & Scores</div>
          <button class="btn btn-ghost btn-sm" onclick="openAddBidder()">＋ Add Bidder</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Rank</th><th>Bidder</th><th>Tech</th><th>Fin</th><th>Total</th><th>Rec.</th><th></th>
            </tr></thead>
            <tbody>
              ${bidders.length ? bidders.map(bd => bidderRow(bd)).join('') : `<tr><td colspan="7"><div class="empty-state"><div class="big">🏢</div>No bidders added yet</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <!-- Clarifications -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📝 Clarifications</div>
          <button class="btn btn-ghost btn-sm" onclick="openAddClarif()">＋ Add</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Subject</th><th>Requested</th><th>Response</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>
              ${clarifs.length ? clarifs.map(c => clarifRow(c)).join('') : `<tr><td colspan="5"><div class="empty-state"><div class="big">📝</div>No clarification requests</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- ── Delay detail ── -->
    ${delays.length ? `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">⏱️ SLA Delay Details</div>
        <span class="badge badge-delayed">${delays.length} violation${delays.length>1?'s':''}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Activity</th><th>Type</th><th>Days Over SLA</th>
          </tr></thead>
          <tbody>
            ${delays.map(d => `
            <tr>
              <td style="font-weight:500">${esc(d.activity)}</td>
              <td><span class="badge ${d.status==='COMPLETED_LATE'?'badge-tech':'badge-delayed'}">${d.status==='COMPLETED_LATE'?'⚠ Completed Late':'🔴 Currently Overdue'}</span></td>
              <td style="color:${d.status==='COMPLETED_LATE'?'var(--warning)':'var(--danger)'};font-weight:700">+${d.daysDelayed} days</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>` : ''}
  `;
}

// ═══════════════════════
//  PHASE / ACTIVITY BUILDERS
// ═══════════════════════
function buildPhaseBlock(icon, title, cellsHTML, statuses) {
  const done = statuses.filter(s => s === 'COMPLETED').length;
  const pct  = Math.round((done / statuses.length) * 100);
  const color = pct === 100 ? 'var(--success)' : pct >= 50 ? 'var(--accent)' : 'var(--warning)';
  return `
    <div class="phase-block">
      <div class="phase-head">
        <span class="phase-head-icon">${icon}</span>
        <span class="phase-head-title">${title}</span>
        <div class="phase-progress-wrap">
          <div class="phase-progress-bar">
            <div class="phase-progress-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <span>${done}/${statuses.length}</span>
        </div>
      </div>
      <div class="activities-grid">${cellsHTML}</div>
    </div>`;
}

function buildActCell(label, start, end, status, slaDays, delays) {
  const norm = status || 'PENDING';

  // State classification
  const isDone    = norm === 'COMPLETED';
  const isNA      = norm === 'N/A';
  const isActive  = norm === 'IN_PROGRESS';
  const delayMatch = delays.find(d => d.activity.toLowerCase().replace(/[^a-z]/g,'').includes(label.toLowerCase().replace(/[^a-z]/g,'').substring(0,6)));
  const isDelayed = !isDone && delayMatch;
  const isLateDone = isDone && delayMatch && delayMatch.status === 'COMPLETED_LATE';

  let cellClass = '';
  if (isDone && !isLateDone) cellClass = 'done';
  else if (isActive) cellClass = 'active';
  else if (isDelayed) cellClass = 'delayed';

  let icon  = '⏳';
  let stext = 'Pending';
  let scol  = 'var(--grey-600)';
  if (isNA)            { icon = '➖'; stext = 'N/A';         scol = 'var(--grey-500)'; }
  else if (isDone && !isLateDone) { icon = '✅'; stext = 'Completed';   scol = 'var(--success)'; }
  else if (isLateDone) { icon = '⚠️'; stext = 'Done (Late)'; scol = 'var(--warning)'; }
  else if (isActive)   { icon = '🔄'; stext = 'In Progress'; scol = 'var(--accent)'; }
  else if (isDelayed)  { icon = '🔴'; stext = 'Overdue';     scol = 'var(--danger)'; }

  let slaBadge = '';
  if (delayMatch) {
    const cls = delayMatch.status === 'COMPLETED_LATE' ? 'late' : 'delayed';
    slaBadge = `<div class="act-sla-badge ${cls}">+${delayMatch.daysDelayed}d over SLA</div>`;
  } else if (isDone) {
    slaBadge = `<div class="act-sla-badge ok">✓ On time</div>`;
  }

  return `
    <div class="activity-cell ${cellClass}">
      <div class="connector"></div>
      <div class="act-label">${esc(label)}</div>
      <div class="act-status-icon">${icon}</div>
      <div class="act-status-text" style="color:${scol}">${stext}</div>
      <div class="act-dates">
        <div class="act-date-row"><span class="act-date-key">SLA</span><span class="act-date-val">${slaDays}d</span></div>
        ${start ? `<div class="act-date-row"><span class="act-date-key">Start</span><span class="act-date-val">${fmtDateShort(start)}</span></div>` : ''}
        ${end   ? `<div class="act-date-row"><span class="act-date-key">End</span><span class="act-date-val">${fmtDateShort(end)}</span></div>` : ''}
      </div>
      ${slaBadge}
    </div>`;
}

// ═══════════════════════
//  ROW BUILDERS
// ═══════════════════════
function bidderRow(bd) {
  const t = parseFloat(bd.TECHNICAL_SCORE) || 0;
  const f = parseFloat(bd.FINANCIAL_SCORE)  || 0;
  const tot = parseFloat(bd.TOTAL_SCORE) || 0;
  const rankCls = bd.RANK == 1 ? 'rank-1' : bd.RANK == 2 ? 'rank-2' : bd.RANK == 3 ? 'rank-3' : '';
  return `<tr>
    <td class="${rankCls}" style="font-weight:700;font-size:15px">${bd.RANK ? '#'+bd.RANK : '—'}</td>
    <td style="font-weight:500">${esc(bd.BIDDER_NAME)}</td>
    <td>
      <div class="score-bar-wrap">
        <div class="score-bar"><div class="score-bar-fill" style="width:${t}%;background:${t>=70?'var(--success)':t>=50?'var(--warning)':'var(--danger)'}"></div></div>
        <span style="font-size:12px;font-weight:600">${t}</span>
      </div>
    </td>
    <td>
      <div class="score-bar-wrap">
        <div class="score-bar"><div class="score-bar-fill" style="width:${f}%;background:${f>=70?'var(--success)':f>=50?'var(--warning)':'var(--danger)'}"></div></div>
        <span style="font-size:12px;font-weight:600">${f}</span>
      </div>
    </td>
    <td style="font-weight:700;color:var(--accent)">${tot}</td>
    <td>${bd.RECOMMENDED==='YES' ? '<span class="badge badge-active" style="font-size:10px">✓ Yes</span>' : '<span style="color:var(--grey-600);font-size:12px">—</span>'}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="openEditBidder(${JSON.stringify(bd).replace(/"/g,'&quot;')})">✏️</button></td>
  </tr>`;
}

function clarifRow(c) {
  const statusMap = { 'PENDING': 'badge-tech', 'RESPONDED': 'badge-active', 'CLOSED': 'badge-completed' };
  return `<tr>
    <td style="font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.SUBJECT)}</td>
    <td style="font-size:12px;color:var(--grey-500)">${fmtDate(c.REQUEST_DATE)}</td>
    <td style="font-size:12px;color:var(--grey-500)">${c.RESPONSE_DATE ? fmtDate(c.RESPONSE_DATE) : '—'}</td>
    <td><span class="badge ${statusMap[c.STATUS]||'badge-pending'}" style="font-size:10px">${c.STATUS||'—'}</span></td>
    <td><button class="btn btn-ghost btn-sm" onclick="openEditClarif(${JSON.stringify(c).replace(/"/g,'&quot;')})">✏️</button></td>
  </tr>`;
}

// ═══════════════════════
//  BADGE HELPERS
// ═══════════════════════
function statusBadge(s, delayed) {
  if (delayed) return '<span class="badge badge-delayed">⏱ Delayed</span>';
  const map = { 'ACTIVE': 'badge-active', 'COMPLETED': 'badge-completed' };
  return `<span class="badge ${map[s]||'badge-pending'}">${s||'—'}</span>`;
}
function phaseBadge(p) {
  const map = { 'TECHNICAL': 'badge-tech', 'FINANCIAL': 'badge-fin', 'COMPLETED': 'badge-completed' };
  const lbl = { 'TECHNICAL': '🔬 Technical', 'FINANCIAL': '💰 Financial', 'COMPLETED': '✅ Completed' };
  return `<span class="badge ${map[p]||'badge-pending'}">${lbl[p]||(p||'—')}</span>`;
}

// ═══════════════════════
//  ACTIVITY MODAL
// ═══════════════════════
function openActModal() {
  if (!BID) return;
  const ta = BID.techActivities || {};
  const fa = BID.finActivities  || {};
  fillDate('tDocStart',  ta.TECH_DOC_START);      fillDate('tDocEnd',  ta.TECH_DOC_END);      fillSel('tDocStatus',  ta.TECH_DOC_STATUS||'PENDING');
  fillDate('tClarStart', ta.CLARIFICATION_START); fillDate('tClarEnd', ta.CLARIFICATION_END); fillSel('tClarStatus', ta.CLARIFICATION_STATUS||'PENDING');
  fillDate('tEvalStart', ta.EVAL_PROGRESS_START); fillDate('tEvalEnd', ta.EVAL_PROGRESS_END); fillSel('tEvalStatus', ta.EVAL_PROGRESS_STATUS||'PENDING');
  fillDate('tRptStart',  ta.EVAL_REPORT_START);   fillDate('tRptEnd',  ta.EVAL_REPORT_END);   fillSel('tRptStatus',  ta.EVAL_REPORT_STATUS||'PENDING');
  fillDate('fDocStart',  fa.FIN_DOC_START);        fillDate('fDocEnd',  fa.FIN_DOC_END);        fillSel('fDocStatus',  fa.FIN_DOC_STATUS||'PENDING');
  fillDate('fEngStart',  fa.ENG_EST_START);         fillDate('fEngEnd',  fa.ENG_EST_END);         fillSel('fEngStatus',  fa.ENG_EST_STATUS||'PENDING');
  fillDate('fAuthStart', fa.DOC_AUTH_START);        fillDate('fAuthEnd', fa.DOC_AUTH_END);        fillSel('fAuthStatus', fa.DOC_AUTH_STATUS||'PENDING');
  fillDate('fRptStart',  fa.FIN_REPORT_START);      fillDate('fRptEnd',  fa.FIN_REPORT_END);      fillSel('fRptStatus',  fa.FIN_REPORT_STATUS||'PENDING');
  switchActTab('tech');
  openModal('activityModal');
}

function saveActivities() {
  const techData = {
    bidId: BID_ID,
    techDocStart: v('tDocStart'), techDocEnd: v('tDocEnd'), techDocStatus: v('tDocStatus'),
    clarificationStart: v('tClarStart'), clarificationEnd: v('tClarEnd'), clarificationStatus: v('tClarStatus'),
    evalProgressStart: v('tEvalStart'),  evalProgressEnd: v('tEvalEnd'),  evalProgressStatus: v('tEvalStatus'),
    evalReportStart: v('tRptStart'),     evalReportEnd: v('tRptEnd'),     evalReportStatus: v('tRptStatus'),
  };
  const finData = {
    bidId: BID_ID,
    finDocStart: v('fDocStart'), finDocEnd: v('fDocEnd'), finDocStatus: v('fDocStatus'),
    engEstStart: v('fEngStart'),  engEstEnd: v('fEngEnd'),  engEstStatus: v('fEngStatus'),
    docAuthStart: v('fAuthStart'), docAuthEnd: v('fAuthEnd'), docAuthStatus: v('fAuthStatus'),
    finReportStart: v('fRptStart'), finReportEnd: v('fRptEnd'), finReportStatus: v('fRptStatus'),
  };
  google.script.run
    .withSuccessHandler(r1 => {
      if (!r1.success) { showToast('Tech error: ' + r1.message, 'error'); return; }
      google.script.run
        .withSuccessHandler(r2 => {
          if (r2.success) { closeModal('activityModal'); showToast('Activities saved', 'success'); loadBid(); }
          else showToast('Fin error: ' + r2.message, 'error');
        })
        .withFailureHandler(e => showToast(e.message, 'error'))
        .updateFinActivities(finData, SESSION_ID);
    })
    .withFailureHandler(e => showToast(e.message, 'error'))
    .updateTechActivities(techData, SESSION_ID);
}

// ═══════════════════════
//  BIDDER MODAL
// ═══════════════════════
function openAddBidder() {
  document.getElementById('bidderModalTitle').textContent = '🏢 Add Bidder';
  document.getElementById('bidderSaveBtn').textContent    = 'Add Bidder';
  document.getElementById('dMode').value    = 'add';
  document.getElementById('dBidderId').value = '';
  ['dName','dTech','dFin','dNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('dRec').value = 'NO';
  hideErr('bidderErr');
  openModal('bidderModal');
}

function openEditBidder(bd) {
  document.getElementById('bidderModalTitle').textContent = '🏢 Edit Bidder';
  document.getElementById('bidderSaveBtn').textContent    = 'Save Changes';
  document.getElementById('dMode').value     = 'edit';
  document.getElementById('dBidderId').value = bd.BIDDER_ID;
  document.getElementById('dName').value     = bd.BIDDER_NAME || '';
  document.getElementById('dTech').value     = bd.TECHNICAL_SCORE || '';
  document.getElementById('dFin').value      = bd.FINANCIAL_SCORE || '';
  document.getElementById('dRec').value      = bd.RECOMMENDED || 'NO';
  document.getElementById('dNotes').value    = bd.NOTES || '';
  hideErr('bidderErr');
  openModal('bidderModal');
}

function saveBidder() {
  const name = document.getElementById('dName').value.trim();
  if (!name) { showErr('bidderErr', 'Bidder name is required.'); return; }
  const mode = document.getElementById('dMode').value;
  const payload = {
    bidId: BID_ID,
    bidderName: name,
    technicalScore: document.getElementById('dTech').value,
    financialScore:  document.getElementById('dFin').value,
    recommended:     document.getElementById('dRec').value,
    notes:           document.getElementById('dNotes').value,
  };
  if (mode === 'edit') {
    payload.bidderId = document.getElementById('dBidderId').value;
    google.script.run
      .withSuccessHandler(r => r.success ? (closeModal('bidderModal'), showToast('Bidder updated','success'), loadBid()) : showErr('bidderErr', r.message))
      .withFailureHandler(e => showErr('bidderErr', e.message))
      .updateBidder(payload, SESSION_ID);
  } else {
    google.script.run
      .withSuccessHandler(r => r.success ? (closeModal('bidderModal'), showToast('Bidder added','success'), loadBid()) : showErr('bidderErr', r.message))
      .withFailureHandler(e => showErr('bidderErr', e.message))
      .addBidder(payload, SESSION_ID);
  }
}

// ═══════════════════════
//  CLARIF MODAL
// ═══════════════════════
function openAddClarif() {
  document.getElementById('clarifModalTitle').textContent = '📝 Add Clarification';
  document.getElementById('clarifSaveBtn').textContent    = 'Add Clarification';
  document.getElementById('cMode').value = 'add';
  document.getElementById('cClarifId').value = '';
  document.getElementById('cSubject').value  = '';
  document.getElementById('cReqDate').value  = new Date().toISOString().split('T')[0];
  document.getElementById('cRespDate').value = '';
  document.getElementById('cStatus').value   = 'PENDING';
  document.getElementById('cNotes').value    = '';
  hideErr('clarifErr');
  openModal('clarifModal');
}

function openEditClarif(c) {
  document.getElementById('clarifModalTitle').textContent = '📝 Edit Clarification';
  document.getElementById('clarifSaveBtn').textContent    = 'Save Changes';
  document.getElementById('cMode').value     = 'edit';
  document.getElementById('cClarifId').value = c.CLARIFICATION_ID;
  document.getElementById('cSubject').value  = c.SUBJECT || '';
  document.getElementById('cReqDate').value  = c.REQUEST_DATE  ? new Date(c.REQUEST_DATE).toISOString().split('T')[0]  : '';
  document.getElementById('cRespDate').value = c.RESPONSE_DATE ? new Date(c.RESPONSE_DATE).toISOString().split('T')[0] : '';
  document.getElementById('cStatus').value   = c.STATUS || 'PENDING';
  document.getElementById('cNotes').value    = c.NOTES || '';
  hideErr('clarifErr');
  openModal('clarifModal');
}

function saveClarification() {
  const subject = document.getElementById('cSubject').value.trim();
  const reqDate = document.getElementById('cReqDate').value;
  if (!subject || !reqDate) { showErr('clarifErr', 'Subject and request date are required.'); return; }
  const mode = document.getElementById('cMode').value;
  const payload = {
    bidId: BID_ID,
    subject,
    requestDate:  reqDate,
    responseDate: document.getElementById('cRespDate').value,
    status:       document.getElementById('cStatus').value,
    notes:        document.getElementById('cNotes').value,
  };
  if (mode === 'edit') {
    payload.clarificationId = document.getElementById('cClarifId').value;
    google.script.run
      .withSuccessHandler(r => r.success ? (closeModal('clarifModal'), showToast('Clarification updated','success'), loadBid()) : showErr('clarifErr', r.message))
      .withFailureHandler(e => showErr('clarifErr', e.message))
      .updateClarification(payload, SESSION_ID);
  } else {
    google.script.run
      .withSuccessHandler(r => r.success ? (closeModal('clarifModal'), showToast('Clarification added','success'), loadBid()) : showErr('clarifErr', r.message))
      .withFailureHandler(e => showErr('clarifErr', e.message))
      .addClarification(payload, SESSION_ID);
  }
}

// ═══════════════════════
//  UTILS
// ═══════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function switchActTab(tab) {
  document.getElementById('techPane').style.display = tab === 'tech' ? '' : 'none';
  document.getElementById('finPane').style.display  = tab === 'fin'  ? '' : 'none';
  document.querySelectorAll('.act-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
}
function fillDate(id, val) {
  const el = document.getElementById(id); if (!el) return;
  el.value = val ? new Date(val).toISOString().split('T')[0] : '';
}
function fillSel(id, val) {
  const el = document.getElementById(id); if (!el) return;
  el.value = val || '';
}
function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<div class="inline-error">⚠️ ${esc(msg)}</div>`;
  el.style.display = '';
}
function hideErr(id) {
  const el = document.getElementById(id);
  if (el) { el.style.display = 'none'; el.innerHTML = ''; }
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  catch { return String(d); }
}
function fmtDateShort(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }); }
  catch { return String(d); }
}
let toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  document.getElementById('toastIcon').textContent = type === 'success' ? '✅' : '❌';
  document.getElementById('toastMsg').textContent  = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
