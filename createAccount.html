<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bid Evaluation Portal — Create Account</title>
<script src="apps.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#0D1B2A;--navy-mid:#1A2E45;--accent:#2196F3;--accent-dark:#1565C0;--white:#FFFFFF;--grey-300:#CBD5E1;--grey-500:#64748B;--danger:#EF4444;--success:#22C55E;--radius:10px}
  html,body{height:100%;font-family:'Inter',sans-serif;background:var(--navy);color:var(--white);overflow:hidden}
  .bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#0D1B2A 0%,#1A2E45 60%,#0D1B2A 100%);overflow:hidden}
  .bg::before{content:'';position:absolute;inset:-50%;background-image:linear-gradient(rgba(33,150,243,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(33,150,243,0.07) 1px,transparent 1px);background-size:48px 48px;animation:gridMove 20s linear infinite}
  @keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(48px)}}
  .page{position:relative;z-index:1;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .register-card{width:100%;max-width:440px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:32px 32px;backdrop-filter:blur(12px)}
  .card-logo{display:flex;align-items:center;gap:9px;margin-bottom:24px}
  .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .logo-text{font-size:14px;font-weight:700;line-height:1.2}
  .logo-text span{display:block;font-size:10px;font-weight:400;color:var(--grey-500)}
  .card-header{margin-bottom:22px}
  .card-header h2{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
  .card-header p{font-size:13px;color:var(--grey-500)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:11px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--grey-300);margin-bottom:6px}
  .form-group label .req{color:var(--danger);margin-left:2px}
  .input-wrap{position:relative}
  .input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.45;pointer-events:none}
  .form-group input,.form-group select{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:11px 13px 11px 38px;font-size:13px;font-family:'Inter',sans-serif;color:var(--white);outline:none;transition:border-color 0.2s}
  .form-group select{cursor:pointer}
  .form-group select option{background:var(--navy-mid)}
  .form-group input::placeholder{color:var(--grey-500)}
  .form-group input:focus,.form-group select:focus{border-color:var(--accent);background:rgba(33,150,243,0.07)}
  .toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey-500);cursor:pointer;font-size:14px;transition:color 0.2s}
  .toggle-pass:hover{color:var(--white)}
  .fields-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .alert{border-radius:var(--radius);padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:none;align-items:center;gap:8px}
  .alert.error{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#FCA5A5;display:flex}
  .alert.success{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.35);color:#86EFAC;display:flex}
  .alert.hidden{display:none!important}
  .btn-submit{width:100%;padding:12px;border-radius:var(--radius);border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2196F3,#1565C0);color:var(--white);transition:opacity 0.2s,transform 0.15s;margin-top:4px}
  .btn-submit:hover:not(:disabled){opacity:0.9;transform:translateY(-1px)}
  .btn-submit:disabled{opacity:0.5;cursor:not-allowed}
  .btn-submit .spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:var(--white);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-submit.loading .btn-text{display:none}
  .btn-submit.loading .spinner{display:block}
  .back-link{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:18px;font-size:13px;color:var(--grey-500)}
  .back-link a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
  .back-link a:hover{text-decoration:underline}
  @media(max-width:480px){.register-card{padding:24px 18px}.fields-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="register-card">
    <div class="card-logo"><div class="logo-icon">📋</div><div class="logo-text">BidEval <span>Procurement Portal</span></div></div>
    <div class="card-header"><h2>Create Account</h2><p>Fill in your details to register a new account</p></div>
    <div id="alertBox" class="alert hidden"><span id="alertIcon"></span><span id="alertMsg"></span></div>
    <div class="fields-row">
      <div class="form-group"><label>First Name <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="firstName" placeholder="First name" oninput="clearAlert()"/></div></div>
      <div class="form-group"><label>Last Name <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="lastName" placeholder="Last name" oninput="clearAlert()"/></div></div>
    </div>
    <div class="form-group"><label>Username <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">🪪</span><input type="text" id="username" placeholder="Choose a username" autocomplete="username" oninput="clearAlert()"/></div></div>
    <div class="form-group"><label>Role <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">🏷️</span><select id="role"><option value="">— Select Role —</option><option value="VIEWER">Viewer</option><option value="EVALUATOR">Evaluator</option><option value="ADMIN">Admin</option></select></div></div>
    <div class="form-group"><label>Password <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="password" placeholder="Create a password" autocomplete="new-password" oninput="clearAlert()"/><button class="toggle-pass" type="button" onclick="togglePass('password','tp1')" id="tp1">👁</button></div></div>
    <div class="form-group"><label>Confirm Password <span class="req">*</span></label><div class="input-wrap"><span class="input-icon">🔒</span><input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" oninput="clearAlert()"/><button class="toggle-pass" type="button" onclick="togglePass('confirmPassword','tp2')" id="tp2">👁</button></div></div>
    <button class="btn-submit" id="submitBtn" onclick="doRegister()"><span class="btn-text">Create Account</span><div class="spinner"></div></button>
    <div class="back-link">Already have an account? <a onclick="window.location.href='login.html'">Sign in</a></div>
  </div>
</div>
<script>
  window.addEventListener('load',()=>{if(typeof Session!=='undefined'&&Session.isLoggedIn())window.location.href='dashboard.html'});
  function togglePass(iId,bId){const i=document.getElementById(iId),b=document.getElementById(bId);if(i.type==='password'){i.type='text';b.textContent='🙈'}else{i.type='password';b.textContent='👁'}}
  function showAlert(msg,type){const b=document.getElementById('alertBox');document.getElementById('alertIcon').textContent=type==='error'?'⚠️':'✅';document.getElementById('alertMsg').textContent=msg;b.className='alert '+type}
  function clearAlert(){document.getElementById('alertBox').className='alert hidden'}
  function setLoading(on){const b=document.getElementById('submitBtn');b.classList.toggle('loading',on);b.disabled=on}
  function doRegister(){
    clearAlert();
    const firstName=document.getElementById('firstName').value.trim();
    const lastName=document.getElementById('lastName').value.trim();
    const username=document.getElementById('username').value.trim();
    const role=document.getElementById('role').value;
    const password=document.getElementById('password').value;
    const confirm=document.getElementById('confirmPassword').value;
    if(!firstName){showAlert('First name is required.','error');return}
    if(!lastName){showAlert('Last name is required.','error');return}
    if(!username){showAlert('Username is required.','error');return}
    if(!role){showAlert('Please select a role.','error');return}
    if(!password){showAlert('Password is required.','error');return}
    if(password.length<6){showAlert('Password must be at least 6 characters.','error');return}
    if(password!==confirm){showAlert('Passwords do not match.','error');return}
    setLoading(true);
    Auth.registerUser({username,password,fullName:firstName+' '+lastName,role,email:''})
      .then(r=>{
        setLoading(false);
        if(r.success){showAlert('Account created! Redirecting to login…','success');setTimeout(()=>{window.location.href='login.html'},1000)}
        else showAlert(r.message||'Registration failed.','error')
      }).catch(e=>{setLoading(false);showAlert('Error: '+e.message,'error')});
  }
  document.addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
</script>
</body>
</html>
