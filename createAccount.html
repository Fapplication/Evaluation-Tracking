<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bid Evaluation Portal — Create Account</title>
<script src="apps.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:       #0D1B2A;
    --navy-mid:   #1A2E45;
    --navy-light: #243B55;
    --accent:     #2196F3;
    --accent-glow:#1565C0;
    --gold:       #FFC107;
    --white:      #FFFFFF;
    --grey-100:   #F5F7FA;
    --grey-300:   #CBD5E1;
    --grey-500:   #64748B;
    --danger:     #EF4444;
    --success:    #22C55E;
    --radius:     10px;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--white);
    overflow: hidden;
  }

  /* ── Animated background ── */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(135deg, #0D1B2A 0%, #1A2E45 60%, #0D1B2A 100%);
    overflow: hidden;
  }
  .bg::before {
    content: '';
    position: absolute; inset: -50%;
    background-image:
      linear-gradient(rgba(33,150,243,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(33,150,243,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridMove 20s linear infinite;
  }
  @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(48px); } }
  .bg-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18; animation: pulse 6s ease-in-out infinite; }
  .bg-orb.one { width: 420px; height: 420px; background: #2196F3; top: -100px; left: -80px; }
  .bg-orb.two { width: 300px; height: 300px; background: #FFC107; bottom: -60px; right: -60px; animation-delay: 3s; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.18; } 50% { transform: scale(1.15); opacity: 0.26; } }

  /* ── Layout ── */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }

  .register-card {
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 44px 40px;
    backdrop-filter: blur(12px);
  }

  .card-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent-glow));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .logo-text span { display: block; font-size: 11px; font-weight: 400; color: var(--grey-500); }

  .card-header { margin-bottom: 28px; }
  .card-header h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .card-header p  { font-size: 14px; color: var(--grey-500); }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--grey-300); margin-bottom: 7px;
  }
  .form-group label .req { color: var(--danger); margin-left: 2px; }

  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%);
    font-size: 15px; opacity: 0.45; pointer-events: none;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    padding: 12px 14px 12px 40px;
    font-size: 14px; font-family: 'Inter', sans-serif;
    color: var(--white); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .form-group select { cursor: pointer; }
  .form-group select option { background: var(--navy-mid); color: var(--white); }
  .form-group input::placeholder { color: var(--grey-500); }
  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--accent);
    background: rgba(33,150,243,0.07);
  }

  .toggle-pass {
    position: absolute; right: 13px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--grey-500); cursor: pointer; font-size: 15px;
    transition: color 0.2s;
  }
  .toggle-pass:hover { color: var(--white); }

  .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .alert {
    border-radius: var(--radius);
    padding: 11px 15px; font-size: 13px; font-weight: 500;
    margin-bottom: 18px; display: none;
    align-items: center; gap: 9px;
  }
  .alert.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #FCA5A5; display: flex; }
  .alert.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); color: #86EFAC; display: flex; }
  .alert.hidden  { display: none !important; }

  .btn-submit {
    width: 100%; padding: 13px;
    border-radius: var(--radius); border: none;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #2196F3, #1565C0);
    color: var(--white);
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 6px;
    position: relative;
  }
  .btn-submit:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-submit .spinner {
    display: none; width: 17px; height: 17px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: var(--white);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-submit.loading .btn-text { display: none; }
  .btn-submit.loading .spinner  { display: block; }

  .back-link {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-top: 22px;
    font-size: 13px; color: var(--grey-500);
  }
  .back-link a {
    color: var(--accent); cursor: pointer;
    text-decoration: none; font-weight: 500;
  }
  .back-link a:hover { text-decoration: underline; }

  @media (max-width: 520px) {
    .register-card { padding: 32px 22px; }
    .fields-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="bg-orb one"></div>
  <div class="bg-orb two"></div>
</div>

<div class="page">
  <div class="register-card">

    <div class="card-logo">
      <div class="logo-icon">📋</div>
      <div class="logo-text">BidEval <span>Procurement Portal</span></div>
    </div>

    <div class="card-header">
      <h2>Create Account</h2>
      <p>Fill in your details to register a new account</p>
    </div>

    <div id="alertBox" class="alert hidden">
      <span id="alertIcon"></span>
      <span id="alertMsg"></span>
    </div>

    <div class="fields-row">
      <div class="form-group">
        <label>First Name <span class="req">*</span></label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="firstName" placeholder="First name" oninput="clearAlert()"/>
        </div>
      </div>
      <div class="form-group">
        <label>Last Name <span class="req">*</span></label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="lastName" placeholder="Last name" oninput="clearAlert()"/>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Username <span class="req">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🪪</span>
        <input type="text" id="username" placeholder="Choose a username" autocomplete="username" oninput="clearAlert()"/>
      </div>
    </div>

    <div class="form-group">
      <label>Role <span class="req">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🏷️</span>
        <select id="role">
          <option value="">— Select Role —</option>
          <option value="VIEWER">Viewer</option>
          <option value="EVALUATOR">Evaluator</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Password <span class="req">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" oninput="clearAlert()"/>
        <button class="toggle-pass" type="button" onclick="togglePass('password','togglePass1')" id="togglePass1">👁</button>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm Password <span class="req">*</span></label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" oninput="clearAlert()"/>
        <button class="toggle-pass" type="button" onclick="togglePass('confirmPassword','togglePass2')" id="togglePass2">👁</button>
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="doRegister()">
      <span class="btn-text">Create Account</span>
      <div class="spinner"></div>
    </button>

    <div class="back-link">
      Already have an account? <a onclick="goToLogin()">Sign in</a>
    </div>

  </div>
</div>

<script>
  // NO Session.guard() here — this page is for unauthenticated users

  // If already logged in, skip to dashboard
  window.addEventListener('load', function () {
    if (typeof Session !== 'undefined' && Session.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  });

  function goToLogin() { window.location.href = 'login.html'; }

  function togglePass(inputId, btnId) {
    const inp = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    if (inp.type === 'password') { inp.type = 'text';     btn.textContent = '🙈'; }
    else                         { inp.type = 'password'; btn.textContent = '👁'; }
  }

  function showAlert(msg, type) {
    const box  = document.getElementById('alertBox');
    document.getElementById('alertIcon').textContent = type === 'error' ? '⚠️' : '✅';
    document.getElementById('alertMsg').textContent  = msg;
    box.className = 'alert ' + type;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function clearAlert() { document.getElementById('alertBox').className = 'alert hidden'; }

  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.classList.toggle('loading', on);
    btn.disabled = on;
  }

  function doRegister() {
    clearAlert();
    const firstName       = document.getElementById('firstName').value.trim();
    const lastName        = document.getElementById('lastName').value.trim();
    const username        = document.getElementById('username').value.trim();
    const role            = document.getElementById('role').value;
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!firstName)       { showAlert('First name is required.', 'error'); return; }
    if (!lastName)        { showAlert('Last name is required.', 'error'); return; }
    if (!username)        { showAlert('Username is required.', 'error'); return; }
    if (!role)            { showAlert('Please select a role.', 'error'); return; }
    if (!password)        { showAlert('Password is required.', 'error'); return; }
    if (password.length < 6) { showAlert('Password must be at least 6 characters.', 'error'); return; }
    if (password !== confirmPassword) { showAlert('Passwords do not match.', 'error'); return; }

    setLoading(true);

    const userData = { firstName, lastName, username, role, password };

    // Use Auth.register if available in apps.js, otherwise fall back gracefully
    if (typeof Auth !== 'undefined' && typeof Auth.register === 'function') {
      Auth.register(userData)
        .then(res => {
          setLoading(false);
          if (res.success) {
            showAlert('Account created successfully! Redirecting to login…', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1400);
          } else {
            showAlert(res.message || 'Registration failed. Please try again.', 'error');
          }
        })
        .catch(err => {
          setLoading(false);
          showAlert('Server error: ' + err.message, 'error');
        });
    } else {
      // apps.js doesn't expose Auth.register yet — show a clear message
      setLoading(false);
      showAlert('Registration is not yet configured. Ask your admin to add Auth.register() to apps.js.', 'error');
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
