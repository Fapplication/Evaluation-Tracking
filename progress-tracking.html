<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLA Activity Progress Tracking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Insert Navigation Layout Core Here */
    .timeline-container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .timeline-item { display: flex; gap: 16px; margin-bottom: 24px; position: relative; }
    .timeline-item::after { content:''; position:absolute; left:15px; top:32px; bottom:-24px; width:2px; background:#e0e0e0; z-index:1; }
    .timeline-item:last-child::after { display:none; }
    .timeline-marker { width:32px; height:32px; border-radius:50%; background:#1a73e8; display:flex; align-items:center; justify-content:center; color:white; z-index:2; }
    .timeline-body { background: white; padding: 16px; border-radius: 12px; flex: 1; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <button class="menu-toggle" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
    <h3>SLA Tracker</h3>
    <div style="width:24px;"></div>
  </div>

  <main class="main-content">
    <div class="timeline-container">
      <h2 style="margin-bottom:20px;">SLA Track Verification</h2>
      
      <div class="timeline-item">
        <div class="timeline-marker" style="background:#34a853;"><span class="material-icons">check</span></div>
        <div class="timeline-body">
          <h4>Technical Document Collection</h4>
          <p style="font-size:12px; color:#616161;">Completed inside SLA window (3 Days Target)</p>
        </div>
      </div>

      <div class="timeline-item">
        <div class="timeline-marker" style="background:#fbbc04;"><span class="material-icons">schedule</span></div>
        <div class="timeline-body">
          <h4>Technical Evaluation Board</h4>
          <p style="font-size:12px; color:#616161;">Status: In Progress</p>
        </div>
      </div>
    </div>
  </main>
  <script>
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('active'); }
  </script>
</body>
</html>
