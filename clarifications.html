<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Clarifications Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Insert Navigation Layout Core Here */
    .clarify-box { padding: 20px; }
    .card-list { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    .message-card { background: white; padding: 16px; border-radius: 12px; border-left: 4px solid var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <button class="menu-toggle" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
    <h3>Clarifications</h3>
    <div style="width:24px;"></div>
  </div>

  <main class="main-content">
    <div class="clarify-box">
      <h2>Technical & Financial Clarifications</h2>
      
      <div class="card-list" id="clarificationsView">
        <div class="message-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:12px; color:#616161;">
            <span>Phase: Technical Evaluation</span>
            <span>Date: 2026-06-15</span>
          </div>
          <h4 style="margin-bottom:6px;">Subject: Query Regarding Item Specification Checklist</h4>
          <p style="font-size:14px; color:#212121; margin-bottom:12px;">Please clarify whether equivalent processing architectures are accepted.</p>
          <div style="text-align:right;">
            <button style="background:none; border:1px solid #1a73e8; color:#1a73e8; padding:6px 12px; border-radius:6px; cursor:pointer;">Respond</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('active'); }
  </script>
</body>
</html>
