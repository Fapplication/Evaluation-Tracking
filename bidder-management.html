<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bidder Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Insert Navigation Layout Core Here */
    .manager-wrapper { padding: 20px; }
    .action-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: 6px; }
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; p: 16px; z-index: 2000; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <button class="menu-toggle" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
    <h3>Manage Bidders</h3>
    <div style="width:24px;"></div>
  </div>

  <main class="main-content">
    <div class="manager-wrapper">
      <div class="action-header">
        <h2>Corporate Bidders Evaluation</h2>
        <button onclick="openModal()" style="padding:10px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">+ Add Bidder</button>
      </div>

      <div class="responsive-table-holder">
        <table>
          <thead>
            <tr style="background:#fafafa; border-bottom:1px solid #eee;">
              <th style="padding:12px;">Company Name</th>
              <th style="padding:12px;">Technical Score</th>
              <th style="padding:12px;">Financial Rating</th>
              <th style="padding:12px; text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="biddersTableData"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal" id="bidderModal">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">Register New Evaluated Bidder</h3>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;">Bidder Name</label>
        <input type="text" id="bidderName" class="form-control">
      </div>
      <div style="margin-bottom:16px;">
        <label style="font-size:12px;">Technical Score</label>
        <input type="number" id="techScore" class="form-control">
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeModal()" style="padding:8px 12px; background:#eee; border:none; border-radius:6px;">Cancel</button>
        <button onclick="saveBidder()" style="padding:8px 12px; background:var(--primary); color:white; border:none; border-radius:6px;">Save Record</button>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('active'); }
    function openModal() { document.getElementById('bidderModal').style.display = 'flex'; }
     Simpson.closeModal = function() { document.getElementById('bidderModal').style.display = 'none'; }
  </script>
</body>
</html>
