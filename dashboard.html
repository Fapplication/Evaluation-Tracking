<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bid Evaluation Portal - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Insert Navigation Layout Core Here */
    .dashboard-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 16px; }
    .stat-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
    .chart-container { background: white; padding: 20px; border-radius: 12px; margin: 20px; position: relative; height: 300px; width: calc(100% - 40px); }
  </style>
</head>
<body>
  <div class="mobile-topbar">
    <button class="menu-toggle" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
    <h3>Bid Evaluation</h3>
    <div style="width:24px;"></div>
  </div>

  <nav class="sidebar" id="appSidebar">
    <div style="padding: 0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1)">
      <h2>Bid Portal</h2>
    </div>
    <div style="padding: 20px 12px;">
      <a class="nav-link active" onclick="navigate('dashboard')"><span class="material-icons">dashboard</span> Dashboard</a>
      <a class="nav-link" onclick="navigate('bidders')"><span class="material-icons">people</span> Bidders</a>
      <a class="nav-link" onclick="navigate('clarifications')"><span class="material-icons">forum</span> Clarifications</a>
      <a class="nav-link" onclick="navigate('progress')"><span class="material-icons">trending_up</span> Progress</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:#1a73e8;"><span class="material-icons">gavel</span></div>
        <div><p style="color:#616161; font-size:13px;">Active Bids</p><h3 id="activeBidsCount">0</h3></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#34a853;"><span class="material-icons">check_circle</span></div>
        <div><p style="color:#616161; font-size:13px;">Completed</p><h3 id="completedBidsCount">0</h3></div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="dashboardChart"></canvas>
    </div>

    <div style="padding: 0 20px 20px;">
      <h3>Recent Procurement Bids</h3>
      <div class="responsive-table-holder">
        <table>
          <thead>
            <tr style="background:#fafafa; border-bottom:1px solid #eee;">
              <th style="padding:12px;">Bid ID</th>
              <th style="padding:12px;">Title</th>
              <th style="padding:12px;">Committee</th>
              <th style="padding:12px;">Status</th>
            </tr>
          </thead>
          <tbody id="bidsTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    function toggleSidebar() { document.getElementById('appSidebar').classList.toggle('active'); }
    function navigate(p) {
      if(p==='bidders') google.script.run.withSuccessHandler(loadPage).getBidderManagementPage();
      if(p==='clarifications') google.script.run.withSuccessHandler(loadPage).getClarificationsPage();
      if(p==='progress') google.script.run.withSuccessHandler(loadPage).getProgressPage();
    }
    function loadPage(h){ document.open(); document.write(h); document.close(); }
  </script>
</body>
</html>
