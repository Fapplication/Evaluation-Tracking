<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bid Evaluation Portal — Dashboard</title>
<script src="apps.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0D1B2A;
    --navy-mid:    #1A2E45;
    --navy-light:  #243B55;
    --navy-card:   #162032;
    --accent:      #2196F3;
    --accent-dark: #1565C0;
    --gold:        #FFC107;
    --white:       #FFFFFF;
    --grey-100:    #F5F7FA;
    --grey-300:    #CBD5E1;
    --grey-500:    #64748B;
    --grey-700:    #334155;
    --danger:      #EF4444;
    --warning:     #F59E0B;
    --success:     #22C55E;
    --info:        #38BDF8;
    --radius:      10px;
    --radius-lg:   16px;
    --sidebar-w:   240px;
  }

  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--navy); color: var(--white); overflow: hidden; }

  /* ── Layout ── */
  .app { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--navy-card);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-logo {
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-logo .logo-mark {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .logo-text span { display: block; font-size: 10px; font-weight: 400; color: var(--grey-500); letter-spacing: 0.05em; }

  .sidebar-nav { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .nav-section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--grey-500); padding: 12px 10px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 500; color: var(--grey-300);
    cursor: pointer; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left;
  }
  .nav-item:hover   { background: rgba(255,255,255,0.05); color: var(--white); }
  .nav-item.active  { background: rgba(33,150,243,0.15); color: var(--accent); }
  .nav-item .icon   { font-size: 16px; width: 20px; text-align: center; }
  .nav-item .badge  {
    margin-left: auto; background: var(--danger); color: var(--white);
    font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center;
  }

  .sidebar-user {
    padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 10px;
  }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-info strong { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-info span   { font-size: 11px; color: var(--grey-500); }
  .btn-logout {
    background: none; border: none; color: var(--grey-500); cursor: pointer; font-size: 16px; padding: 4px;
    transition: color 0.15s;
  }
  .btn-logout:hover { color: var(--danger); }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    padding: 16px 28px; border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 16px; background: var(--navy-card); flex-shrink: 0;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Inter', sans-serif; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: var(--white); }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: var(--grey-300); }
  .btn-outline:hover { background: rgba(255,255,255,0.05); color: var(--white); }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 8px 14px;
  }
  .search-box input { background: none; border: none; color: var(--white); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; width: 200px; }
  .search-box input::placeholder { color: var(--grey-500); }

  /* ── Content ── */
  .content { flex: 1; overflow-y: auto; padding: 28px; }

  /* ── Stats row ── */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--navy-card); border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-lg); padding: 20px 22px;
    display: flex; align-items: flex-start; gap: 16px;
    transition: transform 0.15s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
  }
  .stat-icon.blue   { background: rgba(33,150,243,0.15); }
  .stat-icon.green  { background: rgba(34,197,94,0.15); }
  .stat-icon.orange { background: rgba(245,158,11,0.15); }
  .stat-icon.red    { background: rgba(239,68,68,0.15); }
  .stat-body {}
  .stat-value { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: var(--grey-500); font-weight: 500; }

  /* ── Section title ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .section-header h2 { font-size: 15px; font-weight: 700; }

  /* ── Filter tabs ── */
  .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .filter-tab {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--grey-300);
    transition: all 0.15s; font-family: 'Inter', sans-serif;
  }
  .filter-tab:hover  { background: rgba(255,255,255,0.05); }
  .filter-tab.active { background: var(--accent); border-color: var(--accent); color: var(--white); }

  /* ── Bid Table ── */
  .table-wrap {
    background: var(--navy-card); border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 13px 16px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--grey-500); border-bottom: 1px solid rgba(255,255,255,0.06);
    white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td { padding: 14px 16px; font-size: 13px; vertical-align: middle; }
  .td-bid-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 600; }
  .td-bid-name { font-weight: 500; max-width: 200px; }
  .td-bid-name small { display: block; font-size: 11px; color: var(--grey-500); font-weight: 400; margin-top: 2px; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .badge-blue    { background: rgba(33,150,243,0.15); color: #90CAF9; }
  .badge-green   { background: rgba(34,197,94,0.15);  color: #86EFAC; }
  .badge-orange  { background: rgba(245,158,11,0.15); color: #FCD34D; }
  .badge-red     { background: rgba(239,68,68,0.15);  color: #FCA5A5; }
  .badge-grey    { background: rgba(100,116,139,0.15); color: var(--grey-300); }
  .badge-purple  { background: rgba(139,92,246,0.15); color: #C4B5FD; }

  /* Progress bar */
  .progress-wrap { display: flex; align-items: center; gap: 8px; }
  .progress-bar  { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .progress-fill.low  { background: var(--danger); }
  .progress-fill.mid  { background: var(--warning); }
  .progress-fill.high { background: var(--success); }
  .progress-pct  { font-size: 11px; font-weight: 600; color: var(--grey-300); white-space: nowrap; }

  /* Delay chip */
  .delay-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
  }
  .delay-chip.ok      { color: var(--success); }
  .delay-chip.delayed { color: var(--danger); }

  /* Empty state */
  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--grey-500);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }

  /* Loading */
  .loading-row td { padding: 40px; text-align: center; color: var(--grey-500); }
  .spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; right: 28px; z-index: 9999;
    background: var(--navy-light); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 14px 20px; font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transform: translateY(80px); opacity: 0; transition: all 0.3s;
    max-width: 340px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* PAC/method breakdown cards */
  .breakdown-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .breakdown-card {
    background: var(--navy-card); border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-lg); padding: 20px;
  }
  .breakdown-card h3 { font-size: 13px; font-weight: 700; margin-bottom: 16px; color: var(--grey-300); }
  .breakdown-item { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .breakdown-item:last-child { margin-bottom: 0; }
  .breakdown-label { font-size: 12px; color: var(--grey-300); width: 110px; flex-shrink: 0; }
  .breakdown-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .breakdown-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
  .breakdown-count { font-size: 12px; font-weight: 700; color: var(--white); width: 20px; text-align: right; }

  @media (max-width: 1100px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .breakdown-row { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <div class="logo-icon">📋</div>
        <div class="logo-text">BidEval<span>Procurement Portal</span></div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <button class="nav-item active" onclick="setView('dashboard')">
        <span class="icon">🏠</span> Dashboard
      </button>
      <button class="nav-item" onclick="goToPage('register')">
        <span class="icon">➕</span> Register New Bid
      </button>
      <button class="nav-item" onclick="goToPage('report')">
        <span class="icon">📊</span> Reports
      </button>

      <div class="nav-section-label">Filters</div>
      <button class="nav-item" onclick="filterByStatus('ACTIVE')">
        <span class="icon">🔵</span> Active Bids
        <span class="badge" id="navActiveBadge">0</span>
      </button>
      <button class="nav-item" onclick="filterByStatus('DELAYED')">
        <span class="icon">🔴</span> Delayed
        <span class="badge" id="navDelayedBadge" style="background:var(--warning)">0</span>
      </button>
      <button class="nav-item" onclick="filterByStatus('COMPLETED')">
        <span class="icon">✅</span> Completed
      </button>

      <div class="nav-section-label">Phase</div>
      <button class="nav-item" onclick="filterByPhase('TECHNICAL')">
        <span class="icon">🔬</span> Technical Phase
      </button>
      <button class="nav-item" onclick="filterByPhase('FINANCIAL')">
        <span class="icon">💰</span> Financial Phase
      </button>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">A</div>
      <div class="user-info">
        <strong id="userNameSidebar">Loading…</strong>
        <span id="userRoleSidebar">—</span>
      </div>
      <button class="btn-logout" onclick="doLogout()" title="Sign out">⏻</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search bids…" oninput="applyFilters()"/>
        </div>
        <button class="btn btn-outline" onclick="loadDashboard()">↺ Refresh</button>
        <button class="btn btn-primary" onclick="goToPage('register')">+ New Bid</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content" id="mainContent">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon blue">📋</div>
          <div class="stat-body">
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-label">Total Bids</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div class="stat-body">
            <div class="stat-value" id="statCompleted">—</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">⏳</div>
          <div class="stat-body">
            <div class="stat-value" id="statActive">—</div>
            <div class="stat-label">Active</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red">⚠️</div>
          <div class="stat-body">
            <div class="stat-value" id="statDelayed">—</div>
            <div class="stat-label">Delayed</div>
          </div>
        </div>
      </div>

      <!-- Breakdown -->
      <div class="breakdown-row">
        <div class="breakdown-card">
          <h3>📌 By PAC Level</h3>
          <div id="pacBreakdown">
            <div class="breakdown-item" style="color:var(--grey-500);font-size:13px;">Loading…</div>
          </div>
        </div>
        <div class="breakdown-card">
          <h3>🛒 By Purchase Method</h3>
          <div id="methodBreakdown">
            <div class="breakdown-item" style="color:var(--grey-500);font-size:13px;">Loading…</div>
          </div>
        </div>
      </div>

      <!-- Bids table -->
      <div class="section-header">
        <h2 id="tableTitle">All Bids</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setTabFilter('ALL', this)">All</button>
          <button class="filter-tab" onclick="setTabFilter('TECHNICAL', this)">Technical Phase</button>
          <button class="filter-tab" onclick="setTabFilter('FINANCIAL', this)">Financial Phase</button>
          <button class="filter-tab" onclick="setTabFilter('COMPLETED', this)">Completed</button>
          <button class="filter-tab" onclick="setTabFilter('DELAYED', this)">⚠ Delayed</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Bid No.</th>
              <th>Bid Name</th>
              <th>PAC Level</th>
              <th>Method</th>
              <th>Phase</th>
              <th>Progress</th>
              <th>Delay Status</th>
              <th>Reg. Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bidTableBody">
            <tr class="loading-row"><td colspan="9"><div class="spinner"></div> Loading bids…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"><span id="toastIcon">ℹ️</span><span id="toastMsg"></span></div>

<script>
  // ── Auth guard ──
  Session.guard();
  const user = Session.getUser();

  // ── Init ──
  function initUser() { UI.initUserBar(); }

  let allBids     = [];
  let tabFilter   = 'ALL';
  let statusFilter = null;
  let phaseFilter  = null;

  function goToPage(page) { window.location.href = page + '.html'; }
  function setView(v) {}

  function filterByStatus(s) {
    statusFilter = s; phaseFilter = null; tabFilter = 'ALL';
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.filter-tab').classList.add('active');
    applyFilters();
  }
  function filterByPhase(p) {
    phaseFilter = p; statusFilter = null; tabFilter = 'ALL';
    applyFilters();
  }
  function setTabFilter(f, el) {
    tabFilter = f; statusFilter = null; phaseFilter = null;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    applyFilters();
  }

  // ── Load ──
  function loadDashboard() {
    document.getElementById('bidTableBody').innerHTML =
      '<tr class="loading-row"><td colspan="9"><div class="spinner"></div> Loading bids…</td></tr>';
    BidAPI.getSummaryReport().then(onBidsLoaded).catch(err => showToast('Error: ' + err.message, 'error'));
  }

  function onBidsLoaded(result) {
    if (!result.success) { showToast(result.message, 'error'); return; }
    allBids = result.bids || [];
    renderStats(result.summary);
    renderBreakdown(result.summary);
    applyFilters();
    updateNavBadges();
  }

  // ── Stats ──
  function renderStats(s) {
    document.getElementById('statTotal').textContent     = s.total;
    document.getElementById('statCompleted').textContent = s.completed;
    document.getElementById('statActive').textContent    = s.active;
    document.getElementById('statDelayed').textContent   = s.delayed;
  }

  function renderBreakdown(s) {
    const total = s.total || 1;
    // PAC
    const pacEl = document.getElementById('pacBreakdown');
    pacEl.innerHTML = Object.entries(s.byPAC).map(([k, v]) => `
      <div class="breakdown-item">
        <div class="breakdown-label">${k}</div>
        <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${Math.round(v/total*100)}%"></div></div>
        <div class="breakdown-count">${v}</div>
      </div>`).join('');
    // Method
    const mEl = document.getElementById('methodBreakdown');
    mEl.innerHTML = Object.entries(s.byMethod).map(([k, v]) => `
      <div class="breakdown-item">
        <div class="breakdown-label">${k}</div>
        <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${Math.round(v/total*100)}%;background:linear-gradient(90deg,#FFC107,#F59E0B)"></div></div>
        <div class="breakdown-count">${v}</div>
      </div>`).join('');
  }

  function updateNavBadges() {
    document.getElementById('navActiveBadge').textContent  = allBids.filter(b => b.STATUS === 'ACTIVE').length;
    document.getElementById('navDelayedBadge').textContent = allBids.filter(b => b.delays && b.delays.length > 0).length;
  }

  // ── Filter & Render ──
  function applyFilters() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    let filtered = allBids.filter(b => {
      const matchSearch = !q ||
        (b.BID_NUMBER || '').toLowerCase().includes(q) ||
        (b.BID_NAME   || '').toLowerCase().includes(q);
      let matchTab = true;
      if (tabFilter === 'TECHNICAL')  matchTab = b.CURRENT_PHASE === 'TECHNICAL';
      if (tabFilter === 'FINANCIAL')  matchTab = b.CURRENT_PHASE === 'FINANCIAL';
      if (tabFilter === 'COMPLETED')  matchTab = b.STATUS === 'COMPLETED';
      if (tabFilter === 'DELAYED')    matchTab = b.delays && b.delays.length > 0;
      let matchStatus = !statusFilter;
      if (statusFilter === 'ACTIVE')   matchStatus = b.STATUS === 'ACTIVE';
      if (statusFilter === 'COMPLETED')matchStatus = b.STATUS === 'COMPLETED';
      if (statusFilter === 'DELAYED')  matchStatus = b.delays && b.delays.length > 0;
      let matchPhase = !phaseFilter || b.CURRENT_PHASE === phaseFilter;
      return matchSearch && matchTab && matchStatus && matchPhase;
    });
    renderTable(filtered);
  }

  function renderTable(bids) {
    const tbody = document.getElementById('bidTableBody');
    if (!bids.length) {
      tbody.innerHTML = `<tr><td colspan="9">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <p>No bids found. <a href="register.html" style="color:var(--accent);">Register one now.</a></p>
        </div></td></tr>`;
      return;
    }
    tbody.innerHTML = bids.map(bid => {
      const pct      = bid.overallProgress || 0;
      const fillCls  = pct >= 75 ? 'high' : pct >= 40 ? 'mid' : 'low';
      const delayed  = bid.delays && bid.delays.length > 0;
      const delayChip = delayed
        ? `<span class="delay-chip delayed">⚠ ${bid.delays.length} delayed</span>`
        : `<span class="delay-chip ok">✔ On track</span>`;
      const phaseBadge = bid.CURRENT_PHASE === 'TECHNICAL'
        ? `<span class="badge badge-blue">🔬 Technical</span>`
        : bid.CURRENT_PHASE === 'FINANCIAL'
        ? `<span class="badge badge-orange">💰 Financial</span>`
        : `<span class="badge badge-green">✅ Completed</span>`;
      const statusBadge = bid.STATUS === 'COMPLETED'
        ? `<span class="badge badge-green">Completed</span>`
        : bid.STATUS === 'ACTIVE'
        ? `<span class="badge badge-blue">Active</span>`
        : `<span class="badge badge-grey">${bid.STATUS}</span>`;
      const methodMap = { 'OPEN BID': 'badge-purple', 'DIRECT PURCHASE': 'badge-orange', 'PROFORMA': 'badge-grey' };
      const methodBadge = `<span class="badge ${methodMap[bid.PURCHASE_METHOD]||'badge-grey'}">${bid.PURCHASE_METHOD}</span>`;
      const regDate = bid.REGISTRATION_DATE ? new Date(bid.REGISTRATION_DATE).toLocaleDateString('en-GB') : '—';
      return `<tr onclick="openBid('${bid.BID_ID}')">
        <td class="td-bid-num">${bid.BID_NUMBER || '—'}</td>
        <td class="td-bid-name">${bid.BID_NAME || '—'}<small>${bid.PAC_LEVEL}</small></td>
        <td><span class="badge badge-blue">${bid.PAC_LEVEL}</span></td>
        <td>${methodBadge}</td>
        <td>${phaseBadge}</td>
        <td>
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>
            <span class="progress-pct">${pct}%</span>
          </div>
        </td>
        <td>${delayChip}</td>
        <td style="font-size:12px;color:var(--grey-500)">${regDate}</td>
        <td><button class="btn btn-outline" style="padding:6px 12px;font-size:12px" onclick="event.stopPropagation();openBid('${bid.BID_ID}')">Open →</button></td>
      </tr>`;
    }).join('');
  }

  function openBid(bidId) {
    localStorage.setItem('currentBidId', bidId);
    window.location.href = 'bidDetail.html';
  }

  // ── Logout ──
  function doLogout() { UI.doLogout(); }

  // ── Toast ──
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
    document.getElementById('toastMsg').textContent  = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ── Boot ──
  initUser();
  loadDashboard();</script>
</body>
</html>
