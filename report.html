<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bid Evaluation Portal — Reports</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:        #0D1B2A;
    --navy-mid:    #1A2E45;
    --navy-light:  #243B55;
    --navy-card:   #162436;
    --accent:      #2196F3;
    --accent-dim:  rgba(33,150,243,0.12);
    --gold:        #FFC107;
    --white:       #FFFFFF;
    --grey-300:    #CBD5E1;
    --grey-500:    #64748B;
    --grey-600:    #475569;
    --danger:      #EF4444;
    --danger-dim:  rgba(239,68,68,0.12);
    --success:     #22C55E;
    --success-dim: rgba(34,197,94,0.12);
    --warning:     #F59E0B;
    --warning-dim: rgba(245,158,11,0.12);
    --purple:      #8B5CF6;
    --purple-dim:  rgba(139,92,246,0.12);
    --radius:      10px;
    --radius-lg:   14px;
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--white);
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

  /* ── Topbar ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--navy-mid);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px; height: 60px;
    backdrop-filter: blur(12px);
  }
  .back-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: var(--grey-300);
    font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif;
    cursor: pointer; transition: all 0.15s; text-decoration: none;
  }
  .back-btn:hover { background: rgba(255,255,255,0.09); color: var(--white); }
  .topbar-title { font-size: 16px; font-weight: 700; flex: 1; letter-spacing: -0.01em; }
  .topbar-title span { color: var(--grey-500); font-weight: 400; font-size: 13px; margin-left: 6px; }

  /* ── Page ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; display: flex; flex-direction: column; gap: 20px; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius); border: none;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: linear-gradient(135deg, #2196F3, #1565C0); color: var(--white); }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--grey-300); }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--white); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-success { background: linear-gradient(135deg, #22C55E, #16A34A); color: var(--white); }
  .btn-success:hover { opacity: 0.9; }
  .btn-amber { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); color: var(--warning); }
  .btn-amber:hover { background: rgba(245,158,11,0.25); }
  .btn-purple { background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); color: #C4B5FD; }
  .btn-purple:hover { background: rgba(139,92,246,0.25); }

  /* ── Panel ── */
  .panel {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

  /* ── Stats grid ── */
  .stats-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 14px; }
  .stat-card {
    background: var(--navy-card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-lg);
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: rgba(33,150,243,0.3); }
  .stat-icon { font-size: 20px; }
  .stat-val  { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat-lbl  { font-size: 11px; color: var(--grey-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Two / three col ── */
  .two-col   { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--grey-600); background: rgba(255,255,255,0.025); white-space: nowrap;
  }
  tbody tr { border-top: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; }
  tbody tr:hover { background: rgba(255,255,255,0.025); }
  tbody td { padding: 11px 14px; vertical-align: middle; }
  .cell-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); }
  .cell-dim  { color: var(--grey-500); font-size: 12px; }
  .cell-name { font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Badges ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 99px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .badge-active    { background: var(--success-dim); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
  .badge-active::before { background: var(--success); }
  .badge-completed { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(33,150,243,0.2); }
  .badge-completed::before { background: var(--accent); }
  .badge-delayed   { background: var(--danger-dim); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.2); }
  .badge-delayed::before { background: var(--danger); animation: blink 1.2s infinite; }
  .badge-pending   { background: rgba(255,255,255,0.05); color: var(--grey-500); border: 1px solid rgba(255,255,255,0.08); }
  .badge-pending::before { background: var(--grey-500); }
  .badge-tech { background: var(--warning-dim); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
  .badge-tech::before { background: var(--warning); }
  .badge-fin  { background: var(--purple-dim); color: #C4B5FD; border: 1px solid rgba(139,92,246,0.2); }
  .badge-fin::before  { background: var(--purple); }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Progress bar ── */
  .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 120px; }
  .progress-bar  { flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; }
  .progress-pct  { font-size: 11px; font-weight: 600; color: var(--grey-500); width: 28px; flex-shrink: 0; }

  /* ── Filter bar ── */
  .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap .si { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.4; }
  .search-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
    border-radius: var(--radius); padding: 9px 12px 9px 34px;
    font-size: 13px; font-family: 'Inter', sans-serif; color: var(--white); outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--grey-600); }
  select.filter-sel {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
    border-radius: var(--radius); padding: 9px 12px;
    font-size: 12px; font-family: 'Inter', sans-serif; color: var(--grey-300);
    outline: none; cursor: pointer; transition: border-color 0.2s;
  }
  select.filter-sel:focus { border-color: var(--accent); }
  select.filter-sel option { background: #1A2E45; }

  /* ── Chart bars (mini) ── */
  .mini-chart { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
  .chart-row  { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .chart-row-lbl { width: 120px; color: var(--grey-300); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .chart-row-bar { flex: 1; height: 7px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .chart-row-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .chart-row-val  { font-size: 12px; font-weight: 700; color: var(--white); width: 18px; flex-shrink: 0; text-align: right; }

  /* ── SLA performance ── */
  .sla-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; }
  .sla-cell {
    padding: 14px 18px;
    border-right: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .sla-cell:nth-child(4n) { border-right: none; }
  .sla-cell:nth-last-child(-n+4) { border-bottom: none; }
  .sla-name  { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--grey-500); text-transform: uppercase; margin-bottom: 6px; }
  .sla-stats { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  .sla-num   { font-size: 20px; font-weight: 700; }
  .sla-of    { font-size: 12px; color: var(--grey-600); }
  .sla-rate  { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .sla-rate.good { background: var(--success-dim); color: var(--success); }
  .sla-rate.bad  { background: var(--danger-dim);  color: #FCA5A5; }
  .sla-bar-wrap  { height: 4px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
  .sla-bar-fill  { height: 100%; border-radius: 99px; }

  /* ── PDF export button ── */
  .export-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    background: rgba(33,150,243,0.06);
    border: 1px solid rgba(33,150,243,0.2);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
  }
  .export-info { font-size: 13px; color: var(--grey-300); }
  .export-info strong { color: var(--white); }
  .export-actions { display: flex; gap: 8px; }

  /* ── Rank medal ── */
  .rank-1 { color: #FFD700; }
  .rank-2 { color: #C0C0C0; }
  .rank-3 { color: #CD7F32; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--navy-light); border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius); padding: 11px 16px;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    transform: translateY(12px); opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 999; max-width: 300px;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: all; }
  .toast.success { border-color: rgba(34,197,94,0.35); }
  .toast.error   { border-color: rgba(239,68,68,0.35); }

  /* Loading */
  .loading-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 50vh; gap: 14px;
    color: var(--grey-600); font-size: 14px;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 2px solid rgba(33,150,243,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 28px; color: var(--grey-600); font-size: 13px; text-align: center;
  }
  .empty-state .big { font-size: 26px; }

  /* Responsive */
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(3,1fr); }
    .two-col, .three-col { grid-template-columns: 1fr; }
    .sla-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .sla-grid   { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"><span id="toastIcon">✅</span><span id="toastMsg"></span></div>

<!-- ══════════════ TOPBAR ══════════════ -->
<div class="topbar">
  <button class="back-btn" onclick="goBack()">← Dashboard</button>
  <div class="topbar-title">Reports <span>Summary & Export</span></div>
  <button class="btn btn-ghost btn-sm" onclick="loadData()">🔄 Refresh</button>
  <button class="btn btn-primary btn-sm" onclick="printPage()">🖨️ Print / Export PDF</button>
</div>

<!-- ══════════════ PAGE ══════════════ -->
<div class="page" id="pageContent">
  <div class="loading-screen">
    <div class="spinner"></div>
    Loading report data…
  </div>
</div>

<script>
// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
let SESSION_ID = null;
let ALL_BIDS   = [];

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
window.onload = function () {
  SESSION_ID = sessionStorage.getItem('sessionId');
  if (!SESSION_ID) { window.location.href = '?page=login'; return; }
  loadData();
};

function goBack() { window.location.href = '?page=dashboard'; }

function loadData() {
  document.getElementById('pageContent').innerHTML = `
    <div class="loading-screen"><div class="spinner"></div>Loading report data…</div>`;
  google.script.run
    .withSuccessHandler(onDataLoaded)
    .withFailureHandler(e => showToast(e.message, 'error'))
    .getSummaryReport(SESSION_ID);
}

function onDataLoaded(res) {
  if (!res || !res.success) {
    showToast((res && res.message) || 'Load error', 'error');
    return;
  }
  ALL_BIDS = res.bids || [];
  renderReport();
}

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────
function renderReport() {
  const total     = ALL_BIDS.length;
  const active    = ALL_BIDS.filter(b => b.STATUS === 'ACTIVE').length;
  const completed = ALL_BIDS.filter(b => b.STATUS === 'COMPLETED').length;
  const delayed   = ALL_BIDS.filter(b => b.delays && b.delays.length > 0).length;
  const techPhase = ALL_BIDS.filter(b => b.CURRENT_PHASE === 'TECHNICAL').length;

  // PAC breakdown
  const pac = { 'PAC ONE': 0, 'PAC TWO': 0, 'PAC THREE': 0, 'PAC FOUR': 0 };
  ALL_BIDS.forEach(b => { if (pac[b.PAC_LEVEL] !== undefined) pac[b.PAC_LEVEL]++; });
  const maxPac = Math.max(...Object.values(pac), 1);

  // Method breakdown
  const meth = { 'OPEN BID': 0, 'DIRECT PURCHASE': 0, 'PROFORMA': 0 };
  ALL_BIDS.forEach(b => { if (meth[b.PURCHASE_METHOD] !== undefined) meth[b.PURCHASE_METHOD]++; });
  const maxMeth = Math.max(...Object.values(meth), 1);

  // SLA performance per activity type
  const slaMap = buildSLAStats();

  // Bidders leaderboard (all bids with bidders)
  const leaderboard = buildLeaderboard();

  // Delayed bids table
  const delayedBids = ALL_BIDS.filter(b => b.delays && b.delays.length > 0);

  document.getElementById('pageContent').innerHTML = `

    <!-- Export bar -->
    <div class="export-bar">
      <div class="export-info">
        <strong>Full Summary Report</strong> — ${total} bids total · Generated ${new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'})}
      </div>
      <div class="export-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="printPage()">🖨️ Print / PDF</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      ${sCard('📁','Total Bids', total, '#2196F3')}
      ${sCard('🟢','Active',    active, '#22C55E')}
      ${sCard('✅','Completed', completed, '#2196F3')}
      ${sCard('⏱️','Delayed',  delayed, '#EF4444')}
      ${sCard('🔬','Tech Phase',techPhase,'#F59E0B')}
    </div>

    <!-- Charts row -->
    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📊 Bids by PAC Level</div>
        </div>
        <div style="padding:18px">
          <div class="mini-chart">
            ${Object.entries(pac).map(([k,v]) => `
              <div class="chart-row">
                <div class="chart-row-lbl">${k}</div>
                <div class="chart-row-bar"><div class="chart-row-fill" style="width:${Math.round(v/maxPac*100)}%;background:var(--accent)"></div></div>
                <div class="chart-row-val">${v}</div>
              </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">🛒 Purchase Method Distribution</div>
        </div>
        <div style="padding:18px">
          <div class="mini-chart">
            ${Object.entries(meth).map(([k,v],i) => {
              const colors = ['#2196F3','#22C55E','#F59E0B'];
              return `<div class="chart-row">
                <div class="chart-row-lbl">${k}</div>
                <div class="chart-row-bar"><div class="chart-row-fill" style="width:${Math.round(v/maxMeth*100)}%;background:${colors[i]}"></div></div>
                <div class="chart-row-val">${v}</div>
              </div>`;
            }).join('')}
          </div>
          <!-- Totals note -->
          <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
            ${Object.entries(meth).map(([k,v],i)=>{
              const colors=['#2196F3','#22C55E','#F59E0B'];
              const pct = total > 0 ? Math.round(v/total*100) : 0;
              return `<div style="display:flex;align-items:center;gap:6px;font-size:11px">
                <span style="width:8px;height:8px;border-radius:50%;background:${colors[i]};display:inline-block"></span>
                <span style="color:var(--grey-500)">${k}</span>
                <span style="font-weight:700">${pct}%</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- SLA Performance -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">⏱️ SLA Performance by Activity</div>
        <span style="font-size:12px;color:var(--grey-500)">Across all registered bids</span>
      </div>
      <div class="sla-grid">
        ${slaMap.map(s => `
          <div class="sla-cell">
            <div class="sla-name">${s.name}</div>
            <div class="sla-stats">
              <div class="sla-num" style="color:${s.rate>=70?'var(--success)':s.rate>=50?'var(--warning)':'var(--danger)'}">${s.onTime}</div>
              <div class="sla-of">/ ${s.total} on-time</div>
              <div class="sla-rate ${s.rate>=70?'good':'bad'}">${s.rate}%</div>
            </div>
            <div class="sla-bar-wrap">
              <div class="sla-bar-fill" style="width:${s.rate}%;background:${s.rate>=70?'var(--success)':s.rate>=50?'var(--warning)':'var(--danger)'}"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <!-- All Bids Table -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">📋 All Bids — Detailed Status</div>
        <div class="filter-bar">
          <div class="search-wrap">
            <span class="si">🔍</span>
            <input placeholder="Search bid…" oninput="filterTable(this.value,'rptBidsBody')"/>
          </div>
          <select class="filter-sel" onchange="filterByStatus(this.value,'rptBidsBody')">
            <option value="">All statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
          </select>
          <select class="filter-sel" onchange="filterByPAC(this.value)">
            <option value="">All PAC</option>
            <option>PAC ONE</option><option>PAC TWO</option><option>PAC THREE</option><option>PAC FOUR</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Bid No.</th><th>Name</th><th>PAC</th><th>Method</th>
            <th>Phase</th><th>Progress</th><th>Bidders</th>
            <th>Delays</th><th>Status</th><th>Registered</th>
          </tr></thead>
          <tbody id="rptBidsBody">
            ${ALL_BIDS.length ? ALL_BIDS.map(b => bidRow(b)).join('') : emptyRow(10)}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Bidders Leaderboard -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🏆 Top-Ranked Bidders</div>
        <span style="font-size:12px;color:var(--grey-500)">Sorted by total score</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Rank</th><th>Bidder</th><th>Bid No.</th><th>Bid Name</th>
            <th>Tech Score</th><th>Fin Score</th><th>Total</th><th>Recommended</th>
          </tr></thead>
          <tbody>
            ${leaderboard.length ? leaderboard.map(r => leaderRow(r)).join('') : emptyRow(8)}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Delay Detail -->
    ${delayedBids.length ? `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">⚠️ Delayed Bids — Action Required</div>
        <span class="badge badge-delayed">${delayedBids.length} bid${delayedBids.length>1?'s':''}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Bid No.</th><th>Name</th><th>PAC</th><th>Phase</th><th>Delayed Activity</th><th>Delay Type</th><th>Days Over SLA</th>
          </tr></thead>
          <tbody>
            ${delayedBids.map(b => (b.delays||[]).map(d => `
              <tr>
                <td><span class="cell-mono">${esc(b.BID_NUMBER)}</span></td>
                <td><div class="cell-name">${esc(b.BID_NAME)}</div></td>
                <td><span class="badge badge-pending" style="font-size:10px">${esc(b.PAC_LEVEL)}</span></td>
                <td>${phaseBadge(b.CURRENT_PHASE)}</td>
                <td style="font-weight:500">${esc(d.activity)}</td>
                <td><span class="badge ${d.status==='COMPLETED_LATE'?'badge-tech':'badge-delayed'}" style="font-size:10px">
                  ${d.status==='COMPLETED_LATE'?'⚠ Completed Late':'🔴 Overdue'}
                </span></td>
                <td style="color:${d.status==='COMPLETED_LATE'?'var(--warning)':'var(--danger)'};font-weight:700">+${d.daysDelayed}d</td>
              </tr>`).join('')).join('')}
          </tbody>
        </table>
      </div>
    </div>` : `
    <div class="panel">
      <div class="panel-header"><div class="panel-title">⚠️ Delayed Bids</div></div>
      <div class="empty-state" style="padding:40px"><div class="big">✅</div>No delays detected — all activities within SLA</div>
    </div>`}
  `;
}

// ─────────────────────────────────────────
//  SLA STATS BUILDER
// ─────────────────────────────────────────
function buildSLAStats() {
  const activities = [
    { name: 'Tech Doc Collection', key: 'TECH_DOC', phase: 'tech' },
    { name: 'Clarification',       key: 'CLARIFICATION', phase: 'tech' },
    { name: 'Tech Eval Progress',  key: 'EVAL_PROGRESS', phase: 'tech' },
    { name: 'Tech Eval Report',    key: 'EVAL_REPORT', phase: 'tech' },
    { name: 'Fin Doc Collection',  key: 'FIN_DOC', phase: 'fin' },
    { name: 'Eng Estimation',      key: 'ENG_EST', phase: 'fin' },
    { name: 'Doc Authentication',  key: 'DOC_AUTH', phase: 'fin' },
    { name: 'Fin Eval Report',     key: 'FIN_REPORT', phase: 'fin' },
  ];

  return activities.map(a => {
    let total = 0, onTime = 0;
    ALL_BIDS.forEach(b => {
      const acts = a.phase === 'tech' ? (b.techActivities || {}) : (b.finActivities || {});
      const status = acts[a.key + '_STATUS'];
      if (!status || status === 'PENDING') return;
      if (status === 'N/A') return;
      total++;
      const hasDelay = (b.delays || []).some(d =>
        d.activity.toLowerCase().replace(/[^a-z]/g,'').includes(a.name.toLowerCase().replace(/[^a-z]/g,'').substring(0,6))
      );
      if (!hasDelay) onTime++;
    });
    const rate = total > 0 ? Math.round(onTime / total * 100) : 100;
    return { name: a.name, total, onTime, rate };
  });
}

// ─────────────────────────────────────────
//  LEADERBOARD BUILDER
// ─────────────────────────────────────────
function buildLeaderboard() {
  const rows = [];
  ALL_BIDS.forEach(b => {
    (b.bidders || []).forEach(bd => {
      rows.push({
        rank:        bd.RANK || 99,
        bidderName:  bd.BIDDER_NAME,
        bidNumber:   b.BID_NUMBER,
        bidName:     b.BID_NAME,
        techScore:   parseFloat(bd.TECHNICAL_SCORE) || 0,
        finScore:    parseFloat(bd.FINANCIAL_SCORE)  || 0,
        totalScore:  parseFloat(bd.TOTAL_SCORE) || 0,
        recommended: bd.RECOMMENDED,
      });
    });
  });
  return rows.sort((a, b) => b.totalScore - a.totalScore).slice(0, 20);
}

// ─────────────────────────────────────────
//  ROW BUILDERS
// ─────────────────────────────────────────
function bidRow(b) {
  const pct = b.overallProgress || 0;
  const color = pct === 100 ? 'var(--success)' : pct >= 50 ? 'var(--accent)' : 'var(--warning)';
  const hasDelay = b.delays && b.delays.length > 0;
  return `<tr onclick="window.location.href='?page=bidDetail&bidId=${b.BID_ID}'" style="cursor:pointer">
    <td><span class="cell-mono">${esc(b.BID_NUMBER)}</span></td>
    <td><div class="cell-name">${esc(b.BID_NAME)}</div></td>
    <td><span class="badge badge-pending" style="font-size:10px">${esc(b.PAC_LEVEL)}</span></td>
    <td><span class="cell-dim">${esc(b.PURCHASE_METHOD)}</span></td>
    <td>${phaseBadge(b.CURRENT_PHASE)}</td>
    <td>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="progress-pct">${pct}%</div>
      </div>
    </td>
    <td style="font-weight:600;color:var(--accent)">${(b.bidders||[]).length}</td>
    <td>${hasDelay ? `<span class="badge badge-delayed" style="font-size:10px">+${b.delays.length}</span>` : '<span style="color:var(--success);font-size:13px">✅</span>'}</td>
    <td>${statusBadge(b.STATUS, hasDelay)}</td>
    <td><span class="cell-dim">${fmtDate(b.REGISTRATION_DATE)}</span></td>
  </tr>`;
}

function leaderRow(r) {
  const rankCls = r.rank===1?'rank-1':r.rank===2?'rank-2':r.rank===3?'rank-3':'';
  const tColor = r.techScore>=70?'var(--success)':r.techScore>=50?'var(--warning)':'var(--danger)';
  const fColor = r.finScore>=70?'var(--success)':r.finScore>=50?'var(--warning)':'var(--danger)';
  return `<tr>
    <td class="${rankCls}" style="font-weight:700;font-size:16px">${r.rank <= 3 ? ['🥇','🥈','🥉'][r.rank-1] : '#'+r.rank}</td>
    <td style="font-weight:600">${esc(r.bidderName)}</td>
    <td><span class="cell-mono">${esc(r.bidNumber)}</span></td>
    <td><div class="cell-name" style="max-width:160px">${esc(r.bidName)}</div></td>
    <td style="color:${tColor};font-weight:600">${r.techScore}</td>
    <td style="color:${fColor};font-weight:600">${r.finScore}</td>
    <td style="font-weight:700;color:var(--accent);font-size:15px">${r.totalScore}</td>
    <td>${r.recommended==='YES'?'<span class="badge badge-active" style="font-size:10px">✓ Recommended</span>':'<span style="color:var(--grey-600);font-size:12px">—</span>'}</td>
  </tr>`;
}

// ─────────────────────────────────────────
//  FILTER / SEARCH
// ─────────────────────────────────────────
function filterTable(q, tbodyId) {
  q = q.toLowerCase();
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  tbody.querySelectorAll('tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function filterByStatus(val, tbodyId) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  tbody.querySelectorAll('tr').forEach(r => {
    r.style.display = (!val || r.textContent.includes(val)) ? '' : 'none';
  });
}

function filterByPAC(val) {
  const tbody = document.getElementById('rptBidsBody');
  if (!tbody) return;
  tbody.querySelectorAll('tr').forEach(r => {
    r.style.display = (!val || r.textContent.includes(val)) ? '' : 'none';
  });
}

// ─────────────────────────────────────────
//  CSV EXPORT
// ─────────────────────────────────────────
function exportCSV() {
  const headers = ['Bid Number','Bid Name','PAC Level','Purchase Method','Phase','Progress %',
                   'Bidders','Delays','Status','Registration Date'];
  const rows = ALL_BIDS.map(b => [
    b.BID_NUMBER,
    b.BID_NAME,
    b.PAC_LEVEL,
    b.PURCHASE_METHOD,
    b.CURRENT_PHASE,
    (b.overallProgress || 0) + '%',
    (b.bidders || []).length,
    (b.delays  || []).length,
    b.STATUS,
    fmtDate(b.REGISTRATION_DATE)
  ]);

  const csv = [headers, ...rows]
    .map(r => r.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','))
    .join('\n');

  const blob = new Blob([csv], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'bid_evaluation_report.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exported', 'success');
}

// ─────────────────────────────────────────
//  PRINT / PDF
// ─────────────────────────────────────────
function printPage() { window.print(); }

// ─────────────────────────────────────────
//  STAT CARD HELPER
// ─────────────────────────────────────────
function sCard(icon, label, value, color) {
  return `<div class="stat-card">
    <div class="stat-icon">${icon}</div>
    <div class="stat-val" style="color:${color}">${value}</div>
    <div class="stat-lbl">${label}</div>
  </div>`;
}

// ─────────────────────────────────────────
//  BADGE HELPERS
// ─────────────────────────────────────────
function statusBadge(s, delayed) {
  if (delayed) return '<span class="badge badge-delayed">⏱ Delayed</span>';
  const map = { 'ACTIVE': 'badge-active', 'COMPLETED': 'badge-completed' };
  return `<span class="badge ${map[s]||'badge-pending'}">${s||'—'}</span>`;
}
function phaseBadge(p) {
  const map = { 'TECHNICAL': 'badge-tech', 'FINANCIAL': 'badge-fin', 'COMPLETED': 'badge-completed' };
  const lbl = { 'TECHNICAL': '🔬 Tech', 'FINANCIAL': '💰 Fin', 'COMPLETED': '✅ Done' };
  return `<span class="badge ${map[p]||'badge-pending'}">${lbl[p]||(p||'—')}</span>`;
}

// ─────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
  catch { return String(d); }
}
function emptyRow(cols) {
  return `<tr><td colspan="${cols}"><div class="empty-state"><div class="big">📭</div>No data yet</div></td></tr>`;
}
let toastTimer;
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  document.getElementById('toastIcon').textContent = type==='success'?'✅':'❌';
  document.getElementById('toastMsg').textContent  = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}
