<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Bid Intent - Procurement Intake System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">

    <nav class="bg-slate-900 text-white shadow-md px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight">Bid Evaluation Portal</h1>
        <div class="space-x-4">
            <a href="index.html" class="bg-slate-800 px-4 py-2 rounded text-sm font-medium hover:bg-slate-700 transition">Dashboard Workspace</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto py-10 px-4">
        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-200">
                <h2 class="text-xl font-bold text-slate-900">Initial Bid Intake Profile Registration</h2>
                <p class="text-sm text-slate-500">Initialize a legal tender portfolio. Milestones tracking fields activate automatically post-registration.</p>
            </div>

            <form id="bid-registration-form" class="p-6 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Bid Number / Tender Reference ID *</label>
                        <input type="text" id="bidNumber" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="e.g., BID-2026-X89">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Bid Designation / Scope Title *</label>
                        <input type="text" id="bidName" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="e.g., Server Infrastructure Hardware Supply">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Engineering Estimation ($) *</label>
                        <input type="number" step="0.01" id="engEstimation" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Approved Budget Resource ($) *</label>
                        <input type="number" step="0.01" id="approvedBudget" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="0.00">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Type of Bid *</label>
                        <select id="typeOfBid" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                            <option value="Open">Open</option>
                            <option value="Performa">Performa</option>
                            <option value="Direct">Direct</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Purchase Approving Committee Responsibility *</label>
                        <select id="pacLevel" required class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                            <option value="PAC I">PAC I</option>
                            <option value="PAC II">PAC II</option>
                            <option value="PAC III">PAC III</option>
                            <option value="PAC IV">PAC IV</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Participating Bidders / Competing Organizations *</label>
                    <textarea id="nameOfBidders" required rows="3" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Provide comma-delimited firm entries. e.g. Apex Tech Ltd, Core Global Corp, Oracle Group"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-between items-center">
                    <span id="loading-spinner" class="hidden text-sm text-blue-600 font-semibold animate-pulse">Broadcasting initialization vectors to database cloud...</span>
                    <button type="submit" class="ml-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded shadow-md transition">Commit Bid to Register</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
