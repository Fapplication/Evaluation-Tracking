<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bid Evaluation Tracking Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 420px; border-radius: 15px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-gavel fa-3x text-primary mb-2"></i>
            <h4 class="fw-bold text-dark">Procurement Portal</h4>
            <p class="text-muted small">Sign in to manage active bid workflows</p>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5 fw-bold shadow-sm" id="loginBtn">
                <span id="btnText">Secure Authorization</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="#" class="text-decoration-none small text-muted" onclick="triggerForgotPassword()">Forgot Password Request?</a>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginBtn = document.getElementById('loginBtn');

            btnText.innerText = "Verifying...";
            btnSpinner.classList.remove('d-none');
            loginBtn.disabled = true;

            try {
                const r = await AppAPI.post({ action: "authenticate", username: u, password: p });
                if (r.success) {
                    SessionManager.setSession(r.user);
                    window.location.href = "index.html";
                } else {
                    alert("Invalid credential parameters provided.");
                    resetBtn();
                }
            } catch (err) {
                alert("Central authentication server connectivity failure.");
                resetBtn();
            }
        });

        function resetBtn() {
            document.getElementById('btnText').innerText = "Secure Authorization";
            document.getElementById('btnSpinner').classList.add('d-none');
            document.getElementById('loginBtn').disabled = false;
        }

        function triggerForgotPassword() {
            const email = prompt("Enter registered internal user email address:");
            if (email) alert("If structural verification confirms accounts matches, reset tokens will dispatch.");
        }
    </script>
</body>
</html>
